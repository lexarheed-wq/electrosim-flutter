name: RQ closure qualification (no release)

on:
  push:
    branches:
      - work/rq-closure-20261008
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rq-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g0_storage_geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Verify exact architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 tools/core_unify_architecture_guard.py
          python3 tools/postv2_p1_contract.py
      - name: Storage concurrency and corruption regressions
        working-directory: packages/electrosim_storage
        shell: bash
        run: |
          set -euo pipefail
          dart pub get
          dart analyze
          dart test
      - name: Canvas persistence and application regression
        working-directory: apps/electrosim
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-pub lib/runtime/electrosim_layout_persistence.dart lib/runtime/electrosim_persistence_controller.dart lib/main.dart test/audit_visual_layout_persistence_test.dart
          flutter test --no-pub test/audit_visual_layout_persistence_test.dart test/f17_persistence_test.dart

  g1_design_system:
    needs: g0_storage_geometry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Design system reference and drift contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools.test_f18_g1_design_system -v
          # The historical F18-G1 guard forbids every non-G1 change since
          # September 30. Requalify the CURRENT design system instead.
          git diff --exit-code 09f0459dd584c6231870387e7d5f8d8dd77b647d HEAD -- packages/electrosim_ui_kit docs/f18/g1
          python3 - <<'PY'
          import json
          from pathlib import Path
          mapping=json.loads(Path('docs/f18/g1/F18_G1_TOKEN_MAPPING.json').read_text())
          assert mapping['approval']['humanVisualApproved'] is True
          assert len(mapping['references']) == 4
          print('G1_RQ_CURRENT_TOKEN_MAPPING_PASS')
          PY
      - name: UI kit and G1 tokens
        working-directory: packages/electrosim_ui_kit
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test
