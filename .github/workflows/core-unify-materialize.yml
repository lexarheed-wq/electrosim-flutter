name: CORE-UNIFY materialize canonical files

on:
  push:
    branches:
      - core-unify-20261006
    paths:
      - 'tools/core_unify_missing.tar.gz.b64'
      - '.github/workflows/core-unify-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: core-unify-20261006

      - name: Materialize reviewed CORE-UNIFY files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/core_unify_missing.tar.gz.b64 > /tmp/core_unify_missing.tar.gz
          tar -xzf /tmp/core_unify_missing.tar.gz
          test -f packages/electrosim_domain/lib/src/component_physics_contract.dart
          test -f packages/electrosim_measurements/lib/src/component_health_engine.dart
          test -f tools/core_unify_architecture_guard.py
          python3 tools/core_unify_architecture_guard.py
          git diff --check
          rm tools/core_unify_missing.tar.gz.b64
          rm .github/workflows/core-unify-materialize.yml
          git config user.name "ElectroSim CORE-UNIFY"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "CORE-UNIFY R0: materialize canonical physics and health contracts"
          git push origin HEAD:core-unify-20261006
