name: WIRE-ROUTE02 one-off qualification

on:
  push:
    branches:
      - wire-route02-canvas-perf01-20261007
    paths:
      - '.github/workflows/wire-route02-qualification-oneoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Canvas package
        working-directory: packages/electrosim_canvas
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Scenario package
        working-directory: packages/electrosim_scenarios
        run: |
          set -euo pipefail
          dart pub get
          dart analyze
          dart test

      - name: Application
        working-directory: apps/electrosim
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Upload Flutter test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wire-route02-oneoff-failures
          path: apps/electrosim/test/failures
          if-no-files-found: ignore
          retention-days: 7
