name: F17-R7 diagnostic and supervision

on:
  workflow_dispatch:
  push:
    branches:
      - f17-r7-diagnostic-supervision
    paths:
      - 'apps/electrosim/**'
      - 'packages/electrosim_tp/**'
      - '.github/workflows/f17-r7-diagnostic-supervision.yml'

permissions:
  contents: read

jobs:
  diagnostic-supervision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Resolve app dependencies
        working-directory: apps/electrosim
        run: flutter pub get

      - name: Analyze diagnostic and supervision integration
        working-directory: apps/electrosim
        run: dart analyze lib test/f17_diagnostic_supervision_test.dart test/f17_tp_session_ui_test.dart test/f17_eie_ui_test.dart test/f17_measurement_ui_test.dart test/f9_shell_test.dart

      - name: Run diagnostic and supervision integration tests
        working-directory: apps/electrosim
        run: flutter test test/f17_diagnostic_supervision_test.dart test/f17_tp_session_ui_test.dart test/f17_eie_ui_test.dart test/f17_measurement_ui_test.dart test/f9_shell_test.dart

      - name: Run TP engine regression
        working-directory: packages/electrosim_tp
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Gate marker
        run: echo F17_R7_DIAGNOSTIC_SUPERVISION_GATE_PASS
