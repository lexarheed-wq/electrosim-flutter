name: AC3 Islands and Physical Instruments Regression
on:
  push:
    branches:
      - fix/ac3-floating-islands-meters-20261009
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ac3-islands-instruments
  cancel-in-progress: true
jobs:
  electrical-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
      - name: Preserve versioned industrial painter
        run: python3 tools/premium_rcd2p/decode_source.py
      - name: AC3 end-to-end + instrument load and controls
        working-directory: apps/electrosim
        run: |
          set -e
          flutter pub get
          dart format test/ac3_contactor_motor_real_wiring_test.dart test/ac3_floating_islands_instruments_test.dart
          flutter analyze
          flutter test test/ac3_floating_islands_instruments_test.dart
          flutter test test/ac3_contactor_motor_real_wiring_test.dart
          flutter test test/controls_runtime_integration_test.dart
          flutter test test/sim_r1_physical_instrument_projection_test.dart
          flutter test test/ac1_source_voltage_open_rcd_regression_test.dart
      - name: Established solver AC3 regression
        working-directory: packages/electrosim_solver_ac
        run: |
          set -e
          flutter pub get
          flutter test test/contactor_branch_behavior_test.dart
          flutter test test/ac3_four_wire_source_test.dart
