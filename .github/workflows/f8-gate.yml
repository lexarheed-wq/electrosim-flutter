name: F8 Gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/electrosim_canvas/**'
      - 'apps/electrosim/**'
      - 'tools/run_f8_gate.sh'
      - 'tools/f8_*'
      - 'docs/f8/**'
jobs:
  f8:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - run: chmod +x validate.sh tools/*.sh
      - run: ./validate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f8-audit
          path: |
            audit/f8
            audit/audit_ui.json
            audit/runtime/f8_gate*.json
            audit/runtime/f8_gate*.log
            packages/electrosim_canvas/test/goldens
