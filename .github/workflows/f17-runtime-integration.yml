name: F17 runtime integration

on:
  workflow_dispatch:
  push:
    branches:
      - f17-runtime-integration
    paths:
      - 'apps/electrosim/lib/runtime/**'
      - 'apps/electrosim/test/f17_*'
      - 'apps/electrosim/pubspec.yaml'
      - '.github/workflows/f17-runtime-integration.yml'

permissions:
  contents: read

jobs:
  f17-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/electrosim
        run: flutter pub get
      - name: Analyze runtime bridge
        working-directory: apps/electrosim
        run: dart analyze lib/runtime test/f17_runtime_engine_test.dart
      - name: Run F17 runtime integration tests
        working-directory: apps/electrosim
        run: flutter test test/f17_runtime_engine_test.dart
      - name: Gate marker
        run: echo F17_RUNTIME_GATE_PASS
