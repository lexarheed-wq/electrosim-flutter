name: F18-G2 Shell Navigation

on:
  workflow_dispatch:
  push:
    branches:
      - f18-g2-shell-navigation
    paths:
      - 'apps/electrosim/**'
      - 'packages/electrosim_ui_kit/**'
      - 'docs/superpowers/specs/2026-10-01-electrosim-f18-g2-shell-navigation-design.md'
      - 'docs/superpowers/plans/2026-10-01-electrosim-f18-g2-shell-navigation.md'
      - 'docs/f18/g2/**'
      - '.github/workflows/f18-g2-shell-navigation.yml'

permissions:
  contents: read

jobs:
  shell-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Verify toolchain
        run: |
          flutter --version
          dart --version 2>&1 | grep '3.10.9'
      - name: Resolve application
        working-directory: apps/electrosim
        run: flutter pub get
      - name: Analyze application
        working-directory: apps/electrosim
        run: flutter analyze
      - name: Run G2 navigation tests
        working-directory: apps/electrosim
        run: flutter test test/f18_g2_navigation_test.dart

      - name: Run application non-golden regression tests
        working-directory: apps/electrosim
        shell: bash
        run: |
          set -euo pipefail
          find test -name '*_test.dart' ! -name 'f9_goldens_test.dart' -print0 | xargs -0 flutter test

      - name: Preserve historical visual baselines
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only d578c6598dddf0e08f99ce03b79e731ec36a687f...HEAD -- apps/electrosim/test/goldens apps/electrosim/test/f9_goldens_test.dart packages/electrosim_canvas/test/goldens)"
          if [ -n "$changed" ]; then
            echo "Historical golden evidence was modified:"
            echo "$changed"
            exit 1
          fi
          echo F18_G2_LEGACY_GOLDENS_PRESERVED

      - name: Protect non-UI production packages
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only d578c6598dddf0e08f99ce03b79e731ec36a687f...HEAD)"
          forbidden="$(printf '%s\n' "$changed" | grep -E '^packages/' | grep -v '^packages/electrosim_ui_kit/' || true)"
          if [ -n "$forbidden" ]; then
            echo "G2 modified protected non-UI package scope:"
            echo "$forbidden"
            exit 1
          fi
          echo F18_G2_PROTECTED_SCOPE_PASS

      - name: Gate
        run: echo F18_G2_SHELL_NAVIGATION_GATE_PASS
