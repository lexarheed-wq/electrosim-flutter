name: F18-G11 refresh app goldens

on:
  push:
    branches:
      - f18-g11-tests-audits-20261006
    paths:
      - '.github/workflows/f18-g11-app-golden-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f18-g11-tests-audits-20261006
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Regenerate only intentional F9 references
        working-directory: apps/electrosim
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/f9_goldens_test.dart --update-goldens

      - name: Commit deterministic F9 reference updates
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/electrosim/test/goldens/f9_compact_properties.png \
            apps/electrosim/test/goldens/f9_medium_properties.png \
            apps/electrosim/test/goldens/f9_expanded_properties.png \
            apps/electrosim/test/goldens/f9_compact_student_diagnostic.png
          if git diff --cached --quiet; then
            echo 'F18_G11_APP_GOLDENS_ALREADY_CURRENT'
            exit 0
          fi
          git commit -m 'F18 G11: refresh intentional F9 golden references [skip ci]'
          git push origin HEAD:f18-g11-tests-audits-20261006
          echo F18_G11_APP_GOLDENS_REFRESH_PASS
