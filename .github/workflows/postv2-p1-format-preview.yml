name: Post-V2 P1 format preview

on:
  push:
    branches:
      - postv2-p1-engine-hardening-20261006
    paths:
      - '.github/workflows/postv2-p1-format-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Canonical format diff
        run: |
          dart format             apps/electrosim/test/f18_g4_visual_framework_gate_test.dart             apps/electrosim/test/f18_g5_supported_parity_gate_test.dart             apps/electrosim/test/postv2_p1_motor_visual_direction_test.dart             apps/electrosim/test/postv2_p1_wiring_policy_test.dart             packages/electrosim_topology/lib/src/topology_engine.dart             packages/electrosim_topology/test/topology_engine_test.dart             packages/electrosim_solver_dc/lib/src/solver_dc.dart             packages/electrosim_solver_dc/test/postv2_p1_receiver_polarity_test.dart             packages/electrosim_solver_dc/test/postv2_p1_source_associations_test.dart             packages/electrosim_solver_dc/test/solver_dc_test.dart
          git diff --             apps/electrosim/test/f18_g4_visual_framework_gate_test.dart             apps/electrosim/test/f18_g5_supported_parity_gate_test.dart             apps/electrosim/test/postv2_p1_motor_visual_direction_test.dart             apps/electrosim/test/postv2_p1_wiring_policy_test.dart             packages/electrosim_topology/lib/src/topology_engine.dart             packages/electrosim_topology/test/topology_engine_test.dart             packages/electrosim_solver_dc/lib/src/solver_dc.dart             packages/electrosim_solver_dc/test/postv2_p1_receiver_polarity_test.dart             packages/electrosim_solver_dc/test/postv2_p1_source_associations_test.dart             packages/electrosim_solver_dc/test/solver_dc_test.dart
