name: PNEU R6G Static ISO 5/2 Network Science
on:
  push:
    branches:
      - feat/pneumatics-r6g-static-iso52-network-20261011
  pull_request:
    branches:
      - feat/pneumatics-r6f-authored-workshop-runtime-20261011
      - feat/g5-industrial-geometry-20261009
permissions:
  contents: read
jobs:
  r6g-scientific-spool-network:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.9'
      - name: Validate physical ISO port network at exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/pneumatics-r6g
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "github_sha=$GITHUB_SHA"
            dart --version
          } | tee build/pneumatics-r6g/PROVENANCE.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          (
            cd packages/electrosim_pneumatic_solver
            dart pub get
            dart format lib/src/workshop_closed_air_compiler.dart test/r6_static_valve52_routing_test.dart
            git diff -- lib/src/workshop_closed_air_compiler.dart test/r6_static_valve52_routing_test.dart | tee ../../build/pneumatics-r6g/FORMAT_PATCH.diff
            git diff --exit-code -- lib/src/workshop_closed_air_compiler.dart test/r6_static_valve52_routing_test.dart
            dart analyze
            dart test --concurrency=1 --reporter expanded
          ) 2>&1 | tee build/pneumatics-r6g/SCIENCE.log
          grep -F "R6/G energised P-A B-S paths and conservation" build/pneumatics-r6g/SCIENCE.log
          grep -F "All tests passed!" build/pneumatics-r6g/SCIENCE.log
          git diff --check
          git diff --exit-code -- . ':(exclude)**/pubspec.lock'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pneumatics-r6g-iso52-${{ github.sha }}
          path: build/pneumatics-r6g/
          retention-days: 21
