name: F3 gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/electrosim_domain/**'
      - 'packages/electrosim_topology/**'
      - 'packages/electrosim_solver_dc/**'
      - 'tools/**'
      - 'ci/**'
      - '.github/workflows/f3-gate.yml'
  pull_request:
    paths:
      - 'packages/electrosim_domain/**'
      - 'packages/electrosim_topology/**'
      - 'packages/electrosim_solver_dc/**'
      - 'tools/**'
      - 'ci/**'
      - '.github/workflows/f3-gate.yml'
jobs:
  f3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: F3 gate
        run: |
          chmod +x validate.sh tools/*.sh
          ./tools/run_f3_gate.sh
      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f3-audit
          path: audit/runtime/
