name: P0-P3 Canonical Dart Formatting
on:
  pull_request:
    branches:
      - feat/g5-industrial-geometry-20261009
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p0-p3-dart-format
  cancel-in-progress: false
jobs:
  canonical-format:
    if: github.head_ref == 'refactor/p0-p3-tp-architecture-20261010'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
      - name: Apply formatter to refactored modules
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            packages/electrosim_tp/lib/src/tp_models.dart \
            packages/electrosim_tp/lib/src/tp_engine.dart \
            packages/electrosim_tp/lib/src/verification_engine.dart \
            packages/electrosim_tp/lib/src/wiring_topology_matcher.dart \
            packages/electrosim_tp/test/tp_engine_test.dart \
            packages/electrosim_tp/test/p0_wiring_topology_matcher_test.dart \
            apps/electrosim/lib/runtime/electrosim_tp_session_controller.dart \
            apps/electrosim/lib/runtime/electrosim_lan_sync.dart \
            apps/electrosim/lib/runtime/electrosim_student_web_sync.dart \
            apps/electrosim/lib/f17_tp_session_dialog.dart \
            apps/electrosim/lib/f18_component_type_profile.dart \
            apps/electrosim/lib/f18_component_archetypes.dart \
            apps/electrosim/lib/f18_industrial_dual_view.dart \
            apps/electrosim/test/p0_p1_teacher_student_reference_test.dart \
            apps/electrosim/test/p2_tp_archive_identity_test.dart \
            apps/electrosim/test/p3_component_taxonomy_test.dart
          git diff --check
          git add -- \
            packages/electrosim_tp/lib/src/tp_models.dart \
            packages/electrosim_tp/lib/src/tp_engine.dart \
            packages/electrosim_tp/lib/src/verification_engine.dart \
            packages/electrosim_tp/lib/src/wiring_topology_matcher.dart \
            packages/electrosim_tp/test/tp_engine_test.dart \
            packages/electrosim_tp/test/p0_wiring_topology_matcher_test.dart \
            apps/electrosim/lib/runtime/electrosim_tp_session_controller.dart \
            apps/electrosim/lib/runtime/electrosim_lan_sync.dart \
            apps/electrosim/lib/runtime/electrosim_student_web_sync.dart \
            apps/electrosim/lib/f17_tp_session_dialog.dart \
            apps/electrosim/lib/f18_component_type_profile.dart \
            apps/electrosim/lib/f18_component_archetypes.dart \
            apps/electrosim/lib/f18_industrial_dual_view.dart \
            apps/electrosim/test/p0_p1_teacher_student_reference_test.dart \
            apps/electrosim/test/p2_tp_archive_identity_test.dart \
            apps/electrosim/test/p3_component_taxonomy_test.dart
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(p0-p3): canonical Dart format"
            git push origin "HEAD:refactor/p0-p3-tp-architecture-20261010"
          fi
