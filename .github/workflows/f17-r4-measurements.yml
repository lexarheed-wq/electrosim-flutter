name: F17-R4 measurement integration

on:
  workflow_dispatch:
  push:
    branches:
      - f17-r4-measurements
    paths:
      - 'apps/electrosim/**'
      - 'packages/electrosim_measurements/**'
      - 'packages/electrosim_solver_dc/**'
      - '.github/workflows/f17-r4-measurements.yml'

permissions:
  contents: read

jobs:
  measurements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Resolve app dependencies
        working-directory: apps/electrosim
        run: flutter pub get
      - name: Analyze application measurement integration
        working-directory: apps/electrosim
        run: dart analyze lib test/f17_runtime_engine_test.dart test/f17_catalog_runtime_test.dart test/f17_measurement_ui_test.dart test/f9_shell_test.dart
      - name: Run application measurement integration tests
        working-directory: apps/electrosim
        run: flutter test test/f17_runtime_engine_test.dart test/f17_catalog_runtime_test.dart test/f17_measurement_ui_test.dart test/f9_shell_test.dart
      - name: Run MeasurementEngine regression
        working-directory: packages/electrosim_measurements
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Run DC solver regression
        working-directory: packages/electrosim_solver_dc
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Gate marker
        run: echo F17_R4_MEASUREMENTS_GATE_PASS
