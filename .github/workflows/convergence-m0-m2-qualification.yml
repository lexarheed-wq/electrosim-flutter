name: Convergence M0-M12 qualification

on:
  push:
    branches:
      - f18-v1-v2-convergence
    paths:
      - '.github/workflows/convergence-m0-m2-qualification.yml'
      - 'packages/electrosim_domain/**'
      - 'packages/electrosim_topology/**'
      - 'packages/electrosim_solver_dc/**'
      - 'packages/electrosim_solver_ac/**'
      - 'packages/electrosim_diagnostics/**'
      - 'packages/electrosim_measurements/**'
      - 'packages/electrosim_pv/**'
      - 'packages/electrosim_energy/**'
      - 'packages/electrosim_tp/**'
      - 'apps/electrosim/lib/runtime/electrosim_tp_session_controller.dart'
      - 'apps/electrosim/lib/runtime/electrosim_lan_sync.dart'
      - 'apps/electrosim/lib/f17_tp_session_dialog.dart'
      - 'apps/electrosim/lib/f17_tp_supervision_panel.dart'
      - 'apps/electrosim/lib/f18_component_archetypes.dart'
      - 'apps/electrosim/lib/f9_component_visuals.dart'
      - 'packages/electrosim_canvas/**'
      - 'docs/convergence/**'
      - 'tools/test_convergence_*.py'
      - 'apps/electrosim/lib/f9_component_palette.dart'
      - 'apps/electrosim/lib/main.dart'
      - 'apps/electrosim/test/m3b_palette_canonical_models_test.dart'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Verify exact Dart toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version 2>&1 | grep '3.10.9'

      - name: Static convergence contracts M0-M3
        run: |
          python3 -m unittest \
            tools/test_convergence_m0_contract.py \
            tools/test_convergence_m1_domain_contract.py \
            tools/test_convergence_m1b_m2_contract.py \
            tools/test_convergence_m3a_dc_contract.py \
            tools/test_convergence_m3b_palette_engine_contract.py \
            tools/test_convergence_m4_ac1_contract.py \
            tools/test_convergence_m5_ac3_contract.py \
            tools/test_convergence_m6_device_protection_contract.py \
            tools/test_convergence_m7_measurement_contract.py \
            tools/test_convergence_m8_pv_energy_contract.py \
            tools/test_convergence_m9_diagnostic_contract.py \
            tools/test_convergence_m10_tp_flow_contract.py \
            tools/test_convergence_m11_visual_contract.py \
            tools/test_convergence_m12_ui_contract.py \
            tools/test_f18_g0_tooling.py

      - name: Domain analyze and tests
        working-directory: packages/electrosim_domain
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Topology analyze and tests
        working-directory: packages/electrosim_topology
        run: |
          dart pub get
          dart analyze
          dart test

      - name: DC solver analyze and tests
        working-directory: packages/electrosim_solver_dc
        run: |
          dart pub get
          dart analyze
          dart test

      - name: AC solver analyze and tests
        working-directory: packages/electrosim_solver_ac
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Measurement/device-state analyze and tests
        working-directory: packages/electrosim_measurements
        run: |
          dart pub get
          dart analyze
          dart test

      - name: PV and energy analyze and tests
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/electrosim_pv && dart pub get && dart analyze && dart test)
          (cd packages/electrosim_energy && dart pub get && dart analyze && dart test)

      - name: TP engine analyze and tests
        working-directory: packages/electrosim_tp
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Diagnostics analyze and tests
        working-directory: packages/electrosim_diagnostics
        run: |
          dart pub get
          dart analyze
          dart test

      - name: App analyze and targeted palette/runtime tests
        working-directory: apps/electrosim
        run: |
          flutter pub get
          flutter analyze
          flutter test \
            test/f18_g3r1_point05_palette_contract_test.dart \
            test/m3b_palette_canonical_models_test.dart \
            test/f17_runtime_engine_test.dart \
            test/f17_tp_session_controller_test.dart \
            test/f17_tp_session_ui_test.dart \
            test/f17_diagnostic_supervision_test.dart \
            test/f17_lan_sync_test.dart \
            test/f18_g3r1_point08_visual_archetypes_test.dart \
            test/m11_component_visuals_test.dart \
            test/m12_workspace_responsive_test.dart

      - name: Scenario non-migration guards
        run: |
          python3 tools/f11_static_contract_check.py
          python3 tools/f11_security_static_check.py

      - name: Qualification gate
        run: echo M12_UI_CONVERGENCE_PASS
