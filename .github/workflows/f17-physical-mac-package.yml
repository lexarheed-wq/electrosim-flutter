name: F17 physical Mac validation package

on:
  push:
    branches:
      - f17-physical-mac-validation
    paths:
      - '.github/workflows/f17-physical-mac-package.yml'
      - 'tools/run_macos_test.sh'
      - 'tools/install_macos_intel_toolchain_parts.sh'
      - 'docs/f17/PHYSICAL_MAC_VALIDATION.md'

permissions:
  contents: read

jobs:
  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify qualified marker
        run: test "$(cat VERSION)" = "ELECTROSIM2-F17-R12-QUALIFIED"
      - name: Validate launcher syntax
        run: bash -n tools/run_macos_test.sh
      - name: Create Mac validation source ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -qr dist/ElectroSim2-F17-R12-QUALIFIED-Mac-Validation.zip .             -x '.git/*' 'dist/*' '.dart_tool/*' 'build/*' '**/.DS_Store'
          sha256sum dist/ElectroSim2-F17-R12-QUALIFIED-Mac-Validation.zip             > dist/ElectroSim2-F17-R12-QUALIFIED-Mac-Validation.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim2-F17-R12-QUALIFIED-Mac-Validation
          path: |
            dist/ElectroSim2-F17-R12-QUALIFIED-Mac-Validation.zip
            dist/ElectroSim2-F17-R12-QUALIFIED-Mac-Validation.zip.sha256
          if-no-files-found: error

  mac-intel-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify and split locked official Mac Intel Flutter archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="flutter_macos_3.38.10-stable.zip"
          EXPECTED="b7056ba00082b9b814415e7516287bb94633c1108838bfe10f8f665307b99afa"
          URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$ARCHIVE"

          mkdir -p dist/parts
          curl --fail --location --retry 3 "$URL" -o "dist/$ARCHIVE"

          ACTUAL="$(sha256sum "dist/$ARCHIVE" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          printf '%s  %s\n' "$ACTUAL" "$ARCHIVE" > dist/parts/SHA256SUMS.txt
          split -b 300m -d -a 2 "dist/$ARCHIVE" "dist/parts/$ARCHIVE.part-"

          printf '%s\n' \
            'Place all flutter_macos_3.38.10-stable.zip.part-* files in one folder.' \
            'From the ElectroSim source root, run:' \
            '  chmod +x tools/install_macos_intel_toolchain_parts.sh' \
            '  ./tools/install_macos_intel_toolchain_parts.sh /path/to/that/folder' \
            'Then launch:' \
            '  ./tools/run_macos_test.sh' \
            > dist/parts/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-Flutter-3.38.10-macOS-Intel-manifest
          path: |
            dist/parts/SHA256SUMS.txt
            dist/parts/README.txt
            ci/TOOLCHAIN_LOCK.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-Flutter-3.38.10-macOS-Intel-part-00
          path: dist/parts/flutter_macos_3.38.10-stable.zip.part-00
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-Flutter-3.38.10-macOS-Intel-part-01
          path: dist/parts/flutter_macos_3.38.10-stable.zip.part-01
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-Flutter-3.38.10-macOS-Intel-part-02
          path: dist/parts/flutter_macos_3.38.10-stable.zip.part-02
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-Flutter-3.38.10-macOS-Intel-part-03
          path: dist/parts/flutter_macos_3.38.10-stable.zip.part-03
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-Flutter-3.38.10-macOS-Intel-part-04
          path: dist/parts/flutter_macos_3.38.10-stable.zip.part-04
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-Flutter-3.38.10-macOS-Intel-part-05
          path: dist/parts/flutter_macos_3.38.10-stable.zip.part-05
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-Flutter-3.38.10-macOS-Intel-part-06
          path: dist/parts/flutter_macos_3.38.10-stable.zip.part-06
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-Flutter-3.38.10-macOS-Intel-part-07
          path: dist/parts/flutter_macos_3.38.10-stable.zip.part-07
          if-no-files-found: ignore
