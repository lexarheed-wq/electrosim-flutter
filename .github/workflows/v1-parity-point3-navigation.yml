name: V1 parity point 3 navigation

on:
  push:
    branches:
      - v1-parity
    paths:
      - "apps/electrosim/lib/main.dart"
      - "apps/electrosim/lib/f18_home.dart"
      - "apps/electrosim/lib/f18_shell_navigation.dart"
      - "apps/electrosim/lib/f18_session_coordinator.dart"
      - "apps/electrosim/lib/f18_v1_navigation_flow.dart"
      - "apps/electrosim/lib/navigation_proof_main.dart"
      - "apps/electrosim/test/**"
      - "run_visual.sh"
      - "tools/run_macos_test.sh"
      - "reference/v1/tools/test_point3_macos_launcher_contract.py"
      - ".github/workflows/v1-parity-point3-navigation.yml"
  pull_request:
    branches:
      - v1-parity

permissions:
  contents: read

jobs:
  navigation-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          dart --version 2>&1 | grep "3.10.9"

      - name: Validate macOS launcher LAN permissions
        run: python3 -m unittest reference/v1/tools/test_point3_macos_launcher_contract.py

      - name: Resolve application
        working-directory: apps/electrosim
        run: flutter pub get

      - name: Analyze application
        working-directory: apps/electrosim
        run: flutter analyze

      - name: Run V1 navigation regression tests
        working-directory: apps/electrosim
        shell: bash
        run: |
          set +e
          mkdir -p ../../audit/point3
          flutter test test/f18_g2_navigation_test.dart 2>&1 | tee ../../audit/point3/f18_g2_navigation_test.log
          s1=${PIPESTATUS[0]}
          flutter test test/f18_g3_session_dashboard_test.dart 2>&1 | tee ../../audit/point3/f18_g3_session_dashboard_test.log
          s2=${PIPESTATUS[0]}
          flutter test test/f9_shell_test.dart 2>&1 | tee ../../audit/point3/f9_shell_test.log
          s3=${PIPESTATUS[0]}
          printf 'f18_g2=%s\nf18_g3=%s\nf9_shell=%s\n' "$s1" "$s2" "$s3" | tee ../../audit/point3/navigation-status.txt
          if [ "$s1" -ne 0 ] || [ "$s2" -ne 0 ] || [ "$s3" -ne 0 ]; then
            exit 1
          fi

      - name: Upload navigation diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-parity-point3-navigation-logs
          path: audit/point3
          if-no-files-found: error
          retention-days: 14

      - name: Run application non-golden regression suite
        working-directory: apps/electrosim
        shell: bash
        run: |
          set -euo pipefail
          find test -name "*_test.dart" ! -name "f9_goldens_test.dart" -print0 |
            xargs -0 flutter test

      - name: Build Chromium navigation proof
        working-directory: apps/electrosim
        run: flutter build web --release -t lib/navigation_proof_main.dart

      - name: Upload Chromium proof build
        uses: actions/upload-artifact@v4
        with:
          name: v1-parity-point3-navigation-web
          path: apps/electrosim/build/web
          if-no-files-found: error
          retention-days: 14

      - name: Gate
        run: echo V1_PARITY_POINT3_NAVIGATION_PASS
