name: G12RQ Industrial Rendering Integration and Mac Intel
on:
  push:
    branches:
      - feat/g12rq-industrial-rendering-20261008
permissions:
  contents: write
jobs:
  source-and-regressions:
    if: "!contains(github.event.head_commit.message, 'integrate(render): verified industrial graphics')"
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply source-derived graphics without replacing G12RQ engine
        shell: bash
        run: |
          set -euo pipefail
          test -s integration/industrial-rendering/electrosim-visual-only.patch
          git apply --check --3way integration/industrial-rendering/electrosim-visual-only.patch || {
            git status --short
            git ls-files -u
            exit 1
          }
          git apply --3way integration/industrial-rendering/electrosim-visual-only.patch || {
            echo 'INDUSTRIAL_RENDER_CONFLICT: requires targeted resolution' >&2
            git status --short
            git ls-files -u
            exit 1
          }
          test -z "$(git ls-files -u)"
          git diff --check
          echo INDUSTRIAL_GRAPHIC_PATCH_MERGED
      - name: Export conflict and applied working files if merge fails
        if: failure()
        shell: bash
        run: |
          mkdir -p integration-capture
          git status --short > integration-capture/status.txt
          git ls-files -u > integration-capture/conflicts.txt
          { git diff --name-only -z; git diff --cached --name-only -z; } |
            while IFS= read -r -d '' path; do
              test -f "$path" || continue
              mkdir -p "integration-capture/$(dirname "$path")"
              cp "$path" "integration-capture/$path"
            done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: G12RQ-industrial-graphics-conflict-evidence
          path: integration-capture/
          retention-days: 7
          if-no-files-found: warn
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Format only changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -- '*.dart' |
            while IFS= read -r filename; do
              test -f "$filename" && dart format "$filename"
            done
      - name: Validate Canvas
        working-directory: packages/electrosim_canvas
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Validate UI kit unchanged
        working-directory: packages/electrosim_ui_kit
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Validate application logic and visuals
        working-directory: apps/electrosim
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          mapfile -t tests < <(find test -maxdepth 1 -name '*_test.dart' ! -name 'f9_goldens_test.dart' | sort)
          test "${#tests[@]}" -gt 60
          flutter test --no-pub "${tests[@]}"
      - name: Regenerate actual merged interface goldens and verify
        working-directory: apps/electrosim
        run: |
          flutter test --no-pub --update-goldens test/f9_goldens_test.dart
          flutter test --no-pub
      - name: Physics and electrical nonregression
        shell: bash
        run: |
          set -euo pipefail
          for p in electrosim_domain electrosim_solver_dc electrosim_solver_ac electrosim_measurements electrosim_pv; do
            (cd "packages/$p" && dart pub get && dart analyze && dart test)
          done
          python3 tools/core_unify_architecture_guard.py
          python3 tools/postv2_p1_contract.py
          git diff --check
      - name: Commit only validated targeted rendering changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/electrosim packages/electrosim_canvas packages/electrosim_ui_kit
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source modifications' >&2; exit 1; }
          git commit -m 'integrate(render): verified industrial graphics on G12RQ'
          git push origin HEAD:feat/g12rq-industrial-rendering-20261008
  macos-intel:
    needs: source-and-regressions
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact qualified source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/g12rq-industrial-rendering-20261008
          git checkout -B g12rq-industrial-build origin/feat/g12rq-industrial-rendering-20261008
          git log -1 --format=%s | grep -F 'integrate(render): verified industrial graphics on G12RQ'
          git diff --check
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Build Mac Intel verified archive
        shell: bash
        run: |
          set -euo pipefail
          base="$(pwd)"
          prep_out="$(bash tools/f17_prepare_release_runner.sh macos)"
          case "$prep_out" in
            F17_RUNNER_PATH=*) root="${prep_out#F17_RUNNER_PATH=}" ;;
            *) echo "RUNNER_PATH_PROTOCOL_ERROR: $prep_out" >&2; exit 69 ;;
          esac
          cd "$root/apps/electrosim"
          flutter pub get
          flutter analyze
          flutter test test/f0_smoke_test.dart
          flutter config --enable-macos-desktop
          flutter build macos --release
          app="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          exe="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$exe"
          out="$base/electrosim-industrial-rendering-mac"
          mkdir -p "$out"
          file "$exe" | tee "$out/MAC_ARCH_PROOF.txt"
          grep -qi x86_64 "$out/MAC_ARCH_PROOF.txt"
          git -C "$base" rev-parse HEAD > "$out/SOURCE_SHA.txt"
          flutter --version > "$out/FLUTTER_VERSION.txt"
          dart --version 2> "$out/DART_VERSION.txt"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$out/ElectroSim_G12RQ_IndustrialRendering_macOS_Intel.zip"
          (cd "$out" && shasum -a 256 *.zip > SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-G12RQ-IndustrialRendering-macOS-Intel
          path: electrosim-industrial-rendering-mac/
          retention-days: 14
          if-no-files-found: error
