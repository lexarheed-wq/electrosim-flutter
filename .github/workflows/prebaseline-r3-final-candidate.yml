name: PREBASELINE-R3 final Mac candidate

on:
  push:
    branches:
      - core-island01-prebaseline-r3-20261008
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prebaseline-r3-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-core:
    name: PREBASELINE-R3 final automated qualification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Architecture and toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version | grep '3.38.10'
          dart --version 2>&1 | grep '3.10.9'
          git diff --check
          python3 tools/core_unify_architecture_guard.py
          python3 tools/postv2_p1_contract.py
          python3 tools/f18_g11_audit.py

      - name: Canonical physics packages
        shell: bash
        run: |
          set -euo pipefail
          for pkg in electrosim_domain electrosim_topology electrosim_solver_dc electrosim_solver_ac electrosim_pv electrosim_controls electrosim_measurements electrosim_diagnostics; do
            (
              cd "packages/$pkg"
              dart pub get
              dart analyze
              dart test
            )
          done

      - name: Canvas interaction, routing and performance
        working-directory: packages/electrosim_canvas
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Product libraries remain clean
        working-directory: packages/electrosim_scenarios
        shell: bash
        run: |
          set -euo pipefail
          dart pub get
          dart analyze
          dart test

      - name: Complete application regression suite
        working-directory: apps/electrosim
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          git diff --exit-code -- pubspec.lock
          flutter analyze
          flutter test

  macos-intel:
    name: PREBASELINE-R3 macOS Intel release candidate
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          flutter --version | grep '3.38.10'
          dart --version 2>&1 | grep '3.10.9'
          git diff --check
          python3 tools/core_unify_architecture_guard.py
          python3 tools/postv2_p1_contract.py
          python3 tools/f18_g11_audit.py

      - name: Canvas interaction qualification on Intel
        working-directory: packages/electrosim_canvas
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test test/hit_test_engine_test.dart
          flutter test test/canvas_interaction_performance_test.dart
          flutter test test/canvas_performance_test.dart
          flutter test test/wire_preview_planner_test.dart
          flutter test test/orthogonal_wire_router_test.dart
          flutter test test/circuit_wire_layout_engine_test.dart

      - name: Prepare native runner
        id: runner
        shell: bash
        run: |
          set -euo pipefail
          prep_out="$(bash tools/f17_prepare_release_runner.sh macos)"
          case "$prep_out" in
            F17_RUNNER_PATH=*) tmp="${prep_out#F17_RUNNER_PATH=}" ;;
            *) echo "F17_RUNNER_PATH_PROTOCOL_ERROR: $prep_out" >&2; exit 69 ;;
          esac
          echo "path=$tmp" >> "$GITHUB_OUTPUT"

      - name: Recent regression gates on Intel
        shell: bash
        run: |
          set -euo pipefail
          app_root="${{ steps.runner.outputs.path }}/apps/electrosim"
          cd "$app_root"
          flutter pub get
          flutter analyze
          flutter test test/f18_drag_architecture_test.dart
          flutter test test/core_unify_runtime_health_test.dart
          flutter test test/f18_g7_instruments_properties_test.dart
          flutter test test/pv_load02_canonical_receivers_test.dart
          flutter test test/ac1_palette_runtime_regression_test.dart
          flutter test test/c17_three_phase_library_test.dart
          flutter test test/core_unify_current_flow_test.dart

      - name: Build and prove Intel candidate
        shell: bash
        run: |
          set -euo pipefail
          app_root="${{ steps.runner.outputs.path }}/apps/electrosim"
          cd "$app_root"
          flutter config --enable-macos-desktop
          flutter build macos --release

          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          executable="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$executable"
          architecture="$(file "$executable")"
          printf '%s\n' "$architecture"
          grep -qi 'x86_64' <<< "$architecture"

          out="$GITHUB_WORKSPACE/audit/prebaseline-r3/macos"
          mkdir -p "$out"
          base_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          printf '%s\n' "$base_sha" > "$out/BASE_COMMIT.txt"
          printf '%s\n' "$architecture" > "$out/ARCHITECTURE.txt"
          flutter --version > "$out/FLUTTER_VERSION.txt"
          dart --version 2> "$out/DART_VERSION.txt"

          cat > "$out/PHYSICAL_VALIDATION_REQUIRED.txt" <<'EOF'
          ELECTROSIM PREBASELINE-R3 — validation physique Mac Intel

          1. A environ 25 composants, cablage/preview/drag/pan/zoom sans ralentissement perceptible.
          2. Refaire 50 puis 100 composants pour verifier la marge de fluidite.
          3. Batterie 48 V seule + recepteur CC 48 V compatible : fonctionnement autonome.
          4. PV + MPPT + batterie sans onduleur : charge batterie maintenue.
          5. Onduleur 48 V / 230 V + lampe canonique 230 V : STANDBY sans charge, RUN avec charge.
          6. La lampe 24 V CC ne doit pas etre proposee comme recepteur triphase.
          7. Moteur 6 bornes : Y complet et Delta complet fonctionnent; couplage incomplet/invalide ne doit pas etre normal.
          8. Reseau triphase sans neutre avec charge qui n'en a pas besoin : pas de fausse anomalie.
          9. LED directement sur 24 V : stress/degradation/destruction visibles et proprietes coherentes.
          10. Le stress est affiche comme sollicitation du seuil en pourcentage, sans ambiguite "x0.91".
          11. Sens visuel DC conforme au courant conventionnel calcule.
          12. Propriete/Mesures/EIE restent issus du RuntimeSnapshot et coherents avec le solveur.

          Ne declarer PHYSICAL_MAC_PASS qu'apres verification reelle de ces points.
          EOF

          ditto -c -k --sequesterRsrc --keepParent "$app_path"             "$out/ElectroSim_PREBASELINE_R3_${base_sha:0:12}_macOS_Intel.zip"
          shasum -a 256 "$out"/*.zip > "$out/SHA256.txt"

      - name: Package exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/audit/prebaseline-r3/source"
          mkdir -p "$out"
          base_sha="$(git rev-parse HEAD)"
          git archive --format=zip             --output="$out/ElectroSim_PREBASELINE_R3_SOURCE_${base_sha:0:12}.zip" HEAD
          printf '%s\n' "$base_sha" > "$out/BASE_COMMIT.txt"
          shasum -a 256 "$out"/*.zip > "$out/SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-PREBASELINE-R3-macOS-Intel
          path: audit/prebaseline-r3/macos
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-PREBASELINE-R3-source
          path: audit/prebaseline-r3/source
          if-no-files-found: error
          retention-days: 14

  final-gate:
    name: PREBASELINE-R3 automated final gate
    needs:
      - final-core
      - macos-intel
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo PREBASELINE_R3_AUTOMATED_FINAL_PASS
          echo PREBASELINE_R3_PHYSICAL_MAC_PASS=PENDING_USER_VALIDATION
