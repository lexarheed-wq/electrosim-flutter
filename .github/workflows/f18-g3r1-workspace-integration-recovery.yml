name: F18-G3R1 Workspace Integration Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - f18-g3r1-workspace-integration-recovery
    paths:
      - 'apps/electrosim/**'
      - 'packages/electrosim_canvas/**'
      - '.github/workflows/f18-g3r1-workspace-integration-recovery.yml'

permissions:
  contents: read

jobs:
  point01-runtime-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Verify toolchain
        run: |
          flutter --version
          dart --version 2>&1 | grep '3.10.9'
      - name: Resolve app
        working-directory: apps/electrosim
        run: flutter pub get
      - name: Analyze app
        working-directory: apps/electrosim
        run: flutter analyze
      - name: Point 01 runtime router integration
        working-directory: apps/electrosim
        run: flutter test test/f18_g3r1_point01_runtime_router_test.dart

      - name: Point 02 smart canvas integration
        working-directory: apps/electrosim
        run: flutter test test/f18_g3r1_point02_smart_canvas_integration_test.dart

      - name: Point 03 DC rectangular workspace
        working-directory: apps/electrosim
        run: flutter test test/f18_g3r1_point03_dc_rectangular_workspace_test.dart

      - name: Point 04 no automatic different-net crossing
        working-directory: apps/electrosim
        run: flutter test test/f18_g3r1_point04_no_auto_crossing_test.dart

      - name: Point 05 F18 palette contract
        working-directory: apps/electrosim
        run: flutter test test/f18_g3r1_point05_palette_contract_test.dart

      - name: Point 06 topbar rotation and single delete
        working-directory: apps/electrosim
        run: flutter test test/f18_g3r1_point06_topbar_actions_rotation_test.dart

      - name: Application non-golden regression
        working-directory: apps/electrosim
        shell: bash
        run: |
          set -euo pipefail
          find test -name '*_test.dart' ! -name 'f9_goldens_test.dart' -print0 | xargs -0 flutter test

      - name: Protect package scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 6bcfacbf2b39c0667ac695a80b39d4f3e215615b...HEAD -- packages)"
          forbidden="$(printf '%s\n' "$changed" | grep -v '^packages/electrosim_canvas/' || true)"
          if [ -n "$forbidden" ]; then
            echo "G3R1 modified a package outside the explicitly allowed Canvas scope:"
            echo "$forbidden"
            exit 1
          fi
          echo F18_G3R1_PACKAGE_SCOPE_PASS

      - name: Point 01 gate
        run: echo F18_G3R1_P01_G2A_RUNTIME_ROUTER_PASS

      - name: Point 02 gate
        run: echo F18_G3R1_P02_SMART_CANVAS_INTEGRATION_PASS

      - name: Point 03 gate
        run: echo F18_G3R1_P03_DC_RECTANGULAR_WORKSPACE_PASS

      - name: Point 04 gate
        run: echo F18_G3R1_P04_NO_AUTO_CROSSING_PASS

      - name: Point 05 gate
        run: echo F18_G3R1_P05_PALETTE_CONTRACT_PASS

      - name: Point 06 gate
        run: echo F18_G3R1_P06_TOPBAR_ROTATION_SINGLE_DELETE_PASS
