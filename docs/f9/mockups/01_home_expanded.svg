<text x="28" y="38" class="title">F9 reference — Accueil professeur / Expanded</text><rect x="28" y="62" width="1384" height="70" rx="18" fill="#111C2E" stroke="#2A3A52"/><text x="54" y="103" class="h2">ElectroSim</text><text x="1230" y="103" class="label muted">Aucune session active</text><text x="54" y="183" class="muted">Choisissez le point d’entrée. Les centres restent séparés des sessions pédagogiques.</text><rect x="54" y="236" width="400" height="290" rx="24" fill="#111C2E" stroke="#2A3A52"/><circle cx="106" cy="288" r="22" fill="#38BDF8" opacity="0.18"/><circle cx="106" cy="288" r="8" fill="#38BDF8"/><text x="86" y="344" class="small muted">SESSION</text><text x="86" y="382" class="h2">Créer une nouvelle session</text><foreignObject x="86" y="406" width="336" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:14px Inter,Arial;color:#9FB0C7;line-height:1.45">Préparer une activité, connecter les élèves et superviser la séance.</div></foreignObject><rect x="86" y="474" width="150" height="38" rx="12" fill="#38BDF8"/><text x="110" y="499" class="label" fill="#07111F">Ouvrir</text><rect x="506" y="236" width="400" height="290" rx="24" fill="#111C2E" stroke="#2A3A52"/><circle cx="558" cy="288" r="22" fill="#F59E0B" opacity="0.18"/><circle cx="558" cy="288" r="8" fill="#F59E0B"/><text x="538" y="344" class="small muted">MAINTENANCE</text><text x="538" y="382" class="h2">Centre de maintenance</text><foreignObject x="538" y="406" width="336" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:14px Inter,Arial;color:#9FB0C7;line-height:1.45">Scénarios de panne autonomes et activités de recherche de dérangement.</div></foreignObject><rect x="538" y="474" width="150" height="38" rx="12" fill="#F59E0B"/><text x="562" y="499" class="label" fill="#07111F">Ouvrir</text><rect x="958" y="236" width="400" height="290" rx="24" fill="#111C2E" stroke="#2A3A52"/><circle cx="1010" cy="288" r="22" fill="#34D399" opacity="0.18"/><circle cx="1010" cy="288" r="8" fill="#34D399"/><text x="990" y="344" class="small muted">CONCEPTION</text><text x="990" y="382" class="h2">Centre de conception</text><foreignObject x="990" y="406" width="336" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:14px Inter,Arial;color:#9FB0C7;line-height:1.45">Câblage libre et bibliothèque de schémas sains et fonctionnels.</div></foreignObject><rect x="990" y="474" width="150" height="38" rx="12" fill="#34D399"/><text x="1014" y="499" class="label" fill="#07111F">Ouvrir</text><rect x="54" y="588" width="1304" height="242" rx="20" fill="#17263D" stroke="#2A3A52"/><text x="82" y="630" class="h2">Principes de navigation</text><text x="82" y="672" class="muted">• une session active expose Accueil · Tableau de bord · Gérer la session</text><text x="82" y="706" class="muted">• le Canvas devient la surface dominante dès qu’un simulateur est ouvert</text><text x="82" y="740" class="muted">• les fonctions professeur et élève restent séparées par politique d’accès</text><text x="82" y="774" class="muted">• aucun choix visuel ne modifie la vérité électrique</text><text x="54" y="868" class="small muted mono">REFERENCE ONLY · no production Dart · F9 closed until F8_GATE_PASS</text></svg>