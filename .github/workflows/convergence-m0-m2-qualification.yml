name: Convergence M0-M3B qualification

on:
  push:
    branches:
      - f18-v1-v2-convergence
    paths:
      - '.github/workflows/convergence-m0-m2-qualification.yml'
      - 'packages/electrosim_domain/**'
      - 'packages/electrosim_topology/**'
      - 'packages/electrosim_solver_dc/**'
      - 'packages/electrosim_diagnostics/**'
      - 'docs/convergence/**'
      - 'tools/test_convergence_*.py'
      - 'apps/electrosim/lib/f9_component_palette.dart'
      - 'apps/electrosim/lib/main.dart'
      - 'apps/electrosim/test/m3b_palette_canonical_models_test.dart'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Verify exact Dart toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version 2>&1 | grep '3.10.9'

      - name: Static convergence contracts M0-M3
        run: |
          python3 -m unittest \
            tools/test_convergence_m0_contract.py \
            tools/test_convergence_m1_domain_contract.py \
            tools/test_convergence_m1b_m2_contract.py \
            tools/test_convergence_m3a_dc_contract.py \
            tools/test_convergence_m3b_palette_engine_contract.py \
            tools/test_f18_g0_tooling.py

      - name: Domain analyze and tests
        working-directory: packages/electrosim_domain
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Topology analyze and tests
        working-directory: packages/electrosim_topology
        run: |
          dart pub get
          dart analyze
          dart test

      - name: DC solver analyze and tests
        working-directory: packages/electrosim_solver_dc
        run: |
          dart pub get
          dart analyze
          dart test

      - name: App analyze and targeted palette/runtime tests
        working-directory: apps/electrosim
        run: |
          flutter pub get
          flutter analyze
          flutter test \
            test/f18_g3r1_point05_palette_contract_test.dart \
            test/m3b_palette_canonical_models_test.dart \
            test/f17_runtime_engine_test.dart

      - name: Scenario non-migration guards
        run: |
          python3 tools/f11_static_contract_check.py
          python3 tools/f11_security_static_check.py

      - name: Qualification gate
        run: echo M3B_PALETTE_ENGINE_PARITY_PASS
