name: F17-R12 refresh reviewed F9 goldens

on:
  push:
    branches:
      - f17-r12-release-qualification
    paths:
      - '.github/workflows/f17-r12-refresh-goldens.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f17-r12-release-qualification
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Resolve application dependencies
        working-directory: apps/electrosim
        run: flutter pub get
      - name: Refresh reviewed F9 references
        working-directory: apps/electrosim
        run: |
          flutter test --update-goldens test/f9_goldens_test.dart
          flutter test test/f9_goldens_test.dart
      - name: Restrict change set to golden PNG files
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          [ -n "$changed" ]
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^apps/electrosim/test/goldens/[^/]+\.png$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
      - name: Commit reviewed goldens
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/electrosim/pubspec.lock apps/electrosim/test/goldens/*.png
          git commit -m 'F17-R12: refresh reviewed F9 goldens and dependency lock'
          git push origin HEAD:f17-r12-release-qualification
          echo F17_R12_GOLDEN_REFRESH_PASS
