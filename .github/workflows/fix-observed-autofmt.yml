name: Fix Observed Anomalies Format
on:
  pull_request:
    branches:
      - feat/g5-industrial-geometry-20261009
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'fix/g5-audit-observed-pv-instruments-20261010'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
      - name: Dart formatter
        shell: bash
        run: |
          set -euo pipefail
          dart format apps/electrosim/lib/f9_component_palette.dart apps/electrosim/lib/runtime/electrosim_instrument_projection.dart apps/electrosim/test/g5_audit_observed_pv_instrument_regression_test.dart
          git diff --check
          git add apps/electrosim/lib/f9_component_palette.dart apps/electrosim/lib/runtime/electrosim_instrument_projection.dart apps/electrosim/test/g5_audit_observed_pv_instrument_regression_test.dart
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(pv-meter): canonical Dart format"
            git fetch origin fix/g5-audit-observed-pv-instruments-20261010
            git rebase FETCH_HEAD
            git push origin HEAD:fix/g5-audit-observed-pv-instruments-20261010
          fi
