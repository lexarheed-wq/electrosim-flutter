name: G5 Industrial Geometry Qualification
on:
  push:
    branches:
      - feat/g5-industrial-geometry-20261009
      - feat/industrial-plate-schematic-20261009
  pull_request:
    branches:
      - feat/g5-industrial-geometry-20261009
  workflow_dispatch:
concurrency:
  group: g5-industrial-geometry-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
      - name: Install deterministic golden fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Restore premium RCD source
        run: python3 tools/premium_rcd2p/decode_source.py
      - name: Format qualified Dart files
        run: dart format apps/electrosim/lib/runtime/electrosim_simulation_controller.dart apps/electrosim/lib/reference_components/disjoncteur_3d.dart apps/electrosim/lib/reference_components/rcd2p_industrial_geometry.dart apps/electrosim/test/g12rq_rcd_test_button_runtime_test.dart apps/electrosim/test/g12rq_actual_app_visual_proof_test.dart
      - name: Analyze and test RCD T
        working-directory: apps/electrosim
        run: |
          flutter pub get
          flutter analyze
          flutter test --no-pub --concurrency=1
      - name: Validate TP engine topology, scoring and lifecycle
        working-directory: packages/electrosim_tp
        run: |
          dart pub get
          dart test
      - name: Verify Canvas and DIN support regressions
        working-directory: packages/electrosim_canvas
        run: |
          flutter pub get
          flutter analyze --no-pub lib/src/circuit_scene_painter.dart test/din_rail_layout_test.dart
          flutter test --no-pub --concurrency=1
      - name: Architecture checks
        run: |
          python3 tools/core_unify_architecture_guard.py
          python3 tools/postv2_p1_contract.py
  tp-browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser and QR decoder
        run: |
          python -m pip install -r tools/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build production student Web client and run teacher/student journey
        shell: bash
        run: |
          set -euo pipefail
          base="$PWD"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          output="$(bash tools/f15_prepare_runner.sh web)"
          case "$output" in
            F15_RUNNER_PATH=*) runner="${output#F15_RUNNER_PATH=}" ;;
            *) echo "RUNNER_PATH_PROTOCOL_ERROR: $output"; exit 69 ;;
          esac
          cd "$runner/apps/electrosim"
          flutter build web --release --target lib/student_web_main.dart --no-wasm-dry-run
          cd "$base/apps/electrosim"
          flutter pub get
          export ELECTROSIM_STUDENT_WEB_ROOT="$runner/apps/electrosim/build/web"
          flutter test --no-pub test/tp_real_browser_journey_test.dart --reporter expanded
          printf '%s\n' "$GITHUB_SHA" > build/tp-browser-proof/SOURCE_SHA.txt
          (cd build/tp-browser-proof && sha256sum troubleshooting/*.png wiring/*.png > SHA256.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G5-TP-real-browser-journey
          path: apps/electrosim/build/tp-browser-proof/
          if-no-files-found: error
          retention-days: 14
  visual-evidence:
    needs: runtime-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
      - name: Install deterministic golden fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Restore exact native Dart painter
        run: python3 tools/premium_rcd2p/decode_source.py
      - name: Generate genuine Flutter screenshot (palette and frontal board)
        working-directory: apps/electrosim
        run: |
          flutter pub get
          flutter test --update-goldens test/g12rq_premium_rcd2p_visual_test.dart
          flutter test --update-goldens test/g12rq_actual_app_visual_proof_test.dart
          flutter test --update-goldens test/g5_industrial_states_visual_test.dart
          flutter test --no-pub tool/capture_g5_reference_test.dart
          flutter test --no-pub tool/capture_g5_industrial_test.dart
          test -s test/goldens/g12rq_premium_rcd2p_palette_board.png
          test -s test/goldens/g12rq_actual_widgets_palette_board.png
          test -s test/goldens/g5_industrial_off_on_trip.png
      - name: Capture synchronized industrial workspace at exact source SHA
        working-directory: apps/electrosim
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          flutter test --no-pub tool/capture_industrial_workspace_test.dart
          printf '%s\n' "$GITHUB_SHA" > build/industrial-workspace-proof/SOURCE_SHA.txt
          (cd build/industrial-workspace-proof && sha256sum *.png > SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: G5-Industrial-Flutter-real-proof
          path: |
            apps/electrosim/test/goldens/g12rq_premium_rcd2p_palette_board.png
            apps/electrosim/test/goldens/g12rq_actual_widgets_palette_board.png
            apps/electrosim/test/goldens/g5_industrial_off_on_trip.png
            apps/electrosim/build/g5-reference-proof/
            apps/electrosim/build/g5-industrial-proof/
            apps/electrosim/build/industrial-workspace-proof/
          retention-days: 14
  macos-intel:
    if: github.event_name != 'pull_request'
    needs: [runtime-regression, visual-evidence, tp-browser-journey]
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Never silently build a newer branch head than the tested commit.
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Build genuine industrial G5 macOS x86_64 candidate
        shell: bash
        run: |
          set -euo pipefail
          base="$(pwd)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/premium_rcd2p/decode_source.py
          output="$(bash tools/f17_prepare_release_runner.sh macos)"
          case "$output" in
            F17_RUNNER_PATH=*) root="${output#F17_RUNNER_PATH=}" ;;
            *) echo "RUNNER_PATH_PROTOCOL_ERROR $output"; exit 69 ;;
          esac
          cd "$root/apps/electrosim"
          flutter pub get
          flutter analyze
          flutter test test/g12rq_rcd_test_button_runtime_test.dart
          flutter test test/g12rq_rcd_2p_canvas_integration_test.dart
          flutter test test/g5_physical_housing_assets_test.dart test/g5_native_housing_fallback_test.dart
          flutter test test/g5_industrial_physical_assets_test.dart test/g5_industrial_rendering_test.dart test/g5_industrial_asset_fallback_test.dart test/g5_physical_layout_migration_test.dart
          flutter test test/industrial_duct_workspace_test.dart test/industrial_representation_workspace_test.dart test/industrial_schematic_projection_test.dart test/industrial_cabinet_workspace_test.dart test/industrial_cabinet_model_test.dart test/industrial_workflow_test.dart
          flutter config --enable-macos-desktop
          flutter build macos --release
          app="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          bin="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$bin"
          result="$base/g5-industrial-macos"
          mkdir -p "$result"
          file "$bin" | tee "$result/ARCH.txt"
          grep -qi x86_64 "$result/ARCH.txt"
          printf '%s\n' "$GITHUB_SHA" > "$result/SOURCE_SHA.txt"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$result/ElectroSim_G5_Industrial_macOS_Intel.zip"
          (cd "$result" && shasum -a 256 *.zip > SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-G5-Industrial-macOS-Intel
          path: g5-industrial-macos/
          retention-days: 14
          if-no-files-found: error
