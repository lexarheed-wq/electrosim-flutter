name: F17-R8 local persistence

on:
  workflow_dispatch:
  push:
    branches:
      - f17-r8-local-persistence
    paths:
      - 'apps/electrosim/**'
      - 'packages/electrosim_storage/**'
      - 'packages/electrosim_tp/**'
      - '.github/workflows/f17-r8-local-persistence.yml'
      - 'docs/f17/STATUS.md'
      - 'VERSION'

permissions:
  contents: read

jobs:
  local-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Resolve app dependencies
        working-directory: apps/electrosim
        run: flutter pub get

      - name: Analyze F17-R8 integration
        working-directory: apps/electrosim
        run: dart analyze lib test/f17_persistence_test.dart test/f17_diagnostic_supervision_test.dart test/f17_tp_session_ui_test.dart test/f17_eie_ui_test.dart test/f17_measurement_ui_test.dart test/f9_shell_test.dart

      - name: Run F17-R8 and regression tests
        working-directory: apps/electrosim
        run: flutter test test/f17_persistence_test.dart test/f17_diagnostic_supervision_test.dart test/f17_tp_session_ui_test.dart test/f17_eie_ui_test.dart test/f17_measurement_ui_test.dart test/f9_shell_test.dart

      - name: Validate storage package
        working-directory: packages/electrosim_storage
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Validate TP engine regression
        working-directory: packages/electrosim_tp
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Gate marker
        run: echo F17_R8_LOCAL_PERSISTENCE_GATE_PASS
