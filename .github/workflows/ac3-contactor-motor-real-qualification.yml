name: AC3 Contactor Motor End-to-End Qualification
on:
  push:
    branches:
      - test/ac3-contactor-motor-real-20261009
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ac3-contactor-motor-test
  cancel-in-progress: true
jobs:
  ac3-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
      - name: Preserve Flutter painter
        run: python3 tools/premium_rcd2p/decode_source.py
      - name: Scientific AC3 test and controls regression
        working-directory: apps/electrosim
        run: |
          flutter pub get
          dart format test/ac3_contactor_motor_real_wiring_test.dart
          flutter analyze
          flutter test test/ac3_contactor_motor_real_wiring_test.dart
          flutter test test/controls_runtime_integration_test.dart
          flutter test test/ac1_source_voltage_open_rcd_regression_test.dart
      - name: Canonical AC3 solver tests
        working-directory: packages/electrosim_solver_ac
        run: |
          flutter pub get
          flutter test test/contactor_branch_behavior_test.dart
          flutter test test/ac3_four_wire_source_test.dart
