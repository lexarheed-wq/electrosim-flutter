name: Physical Qualification Formatter
on:
  pull_request:
    branches:
      - feat/g5-industrial-geometry-20261009
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'qualification/g5-physical-families-instruments-dynamics-20261010'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
      - name: Canonical Dart formatting
        shell: bash
        run: |
          set -euo pipefail
          dart format apps/electrosim/lib/runtime/electrosim_instrument_projection.dart apps/electrosim/test/physical_families_instruments_dynamics_qualification_test.dart apps/electrosim/lib/f9_component_palette.dart apps/electrosim/lib/f18_workspace_page.dart
          git diff --check
          git add apps/electrosim/lib/runtime/electrosim_instrument_projection.dart apps/electrosim/test/physical_families_instruments_dynamics_qualification_test.dart apps/electrosim/lib/f9_component_palette.dart apps/electrosim/lib/f18_workspace_page.dart
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(physics): canonical instrument and family qualification formatting"
            git fetch origin "qualification/g5-physical-families-instruments-dynamics-20261010"
            git rebase FETCH_HEAD
            git push origin "HEAD:qualification/g5-physical-families-instruments-dynamics-20261010"
          fi
