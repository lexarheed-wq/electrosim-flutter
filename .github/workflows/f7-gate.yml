name: F7 gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/electrosim_pv/**'
      - 'packages/electrosim_energy/**'
      - 'tools/run_f7_gate.sh'
      - 'tools/f7_*'
      - 'docs/f7/**'
      - 'ci/TOOLCHAIN_LOCK.json'
jobs:
  f7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Run F7 gate
        run: |
          chmod +x validate.sh tools/*.sh
          ./tools/run_f7_gate.sh
