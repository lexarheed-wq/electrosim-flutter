name: P2 Canonical Dart Format (one-shot)
on:
  push:
    branches:
      - feat/postv2-p2-cabinet-layout-r1-20261009
    paths:
      - .github/workflows/postv2-p2-canonical-format-once.yml
permissions:
  contents: write
jobs:
  canonical-format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/postv2-p2-cabinet-layout-r1-20261009
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Format P2 authored files with the pinned Dart SDK
        shell: bash
        run: |
          set -euo pipefail
          cd apps/electrosim
          flutter pub get
          dart format \
            lib/main.dart \
            lib/p2_cabinet_chromium_proof_main.dart \
            lib/runtime/electrosim_layout_persistence.dart \
            test/postv2_p2_cabinet_editor_test.dart \
            test/postv2_p2_cabinet_workspace_test.dart \
            test/postv2_p2_layout_persistence_test.dart
          cd ../..
          cd packages/electrosim_canvas
          flutter pub get
          dart format \
            lib/src/cabinet_layout.dart \
            lib/src/cabinet_duct_wire_planner.dart \
            lib/src/cabinet_fixture_painter.dart \
            lib/src/circuit_scene_painter.dart \
            test/postv2_p2_cabinet_layout_test.dart
          cd ../..
          git diff --check
          git add \
            apps/electrosim/lib/main.dart \
            apps/electrosim/lib/p2_cabinet_chromium_proof_main.dart \
            apps/electrosim/lib/runtime/electrosim_layout_persistence.dart \
            apps/electrosim/test/postv2_p2_cabinet_editor_test.dart \
            apps/electrosim/test/postv2_p2_cabinet_workspace_test.dart \
            apps/electrosim/test/postv2_p2_layout_persistence_test.dart \
            packages/electrosim_canvas/lib/src/cabinet_layout.dart \
            packages/electrosim_canvas/lib/src/cabinet_duct_wire_planner.dart \
            packages/electrosim_canvas/lib/src/cabinet_fixture_painter.dart \
            packages/electrosim_canvas/lib/src/circuit_scene_painter.dart \
            packages/electrosim_canvas/test/postv2_p2_cabinet_layout_test.dart
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(p2): canonical Dart 3.10 formatting for all P2 authored files'
            git push origin HEAD:feat/postv2-p2-cabinet-layout-r1-20261009
          fi
