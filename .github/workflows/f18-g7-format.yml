name: F18-G7 one-shot format

on:
  push:
    branches:
      - f18-g7-instruments-properties-20261006
    paths:
      - '.github/workflows/f18-g7-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Normalize G7 Dart sources
        run: |
          dart format \
            apps/electrosim/lib/f18_g7_property_presenter.dart \
            apps/electrosim/lib/f9_context_panels.dart \
            apps/electrosim/lib/runtime/electrosim_runtime_engine.dart \
            apps/electrosim/test/f18_g7_instruments_properties_test.dart \
            apps/electrosim/test/f17_runtime_engine_test.dart \
            apps/electrosim/test/f17_pv_energy_runtime_test.dart \
            packages/electrosim_measurements/lib/src/device_state_domain_extensions.dart
      - name: Commit normalization and remove one-shot workflow
        run: |
          git config user.name "ElectroSim CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/f18-g7-format.yml
          git add \
            apps/electrosim/lib/f18_g7_property_presenter.dart \
            apps/electrosim/lib/f9_context_panels.dart \
            apps/electrosim/lib/runtime/electrosim_runtime_engine.dart \
            apps/electrosim/test/f18_g7_instruments_properties_test.dart \
            apps/electrosim/test/f17_runtime_engine_test.dart \
            apps/electrosim/test/f17_pv_energy_runtime_test.dart \
            packages/electrosim_measurements/lib/src/device_state_domain_extensions.dart
          git commit -m "style: normalize F18 G7 Dart sources"
          git push origin HEAD:${GITHUB_REF_NAME}
