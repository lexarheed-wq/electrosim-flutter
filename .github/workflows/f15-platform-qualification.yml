name: F15 platform qualification
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - migration-c15-full-parity
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tools/f15_*'
      - 'distribution/f15/**'
      - '.github/workflows/f15-platform-qualification.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: android
            os: ubuntu-latest
          - target: macos
            os: macos-14
          - target: ios
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Linux desktop prerequisites
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Enable desktop target
        if: matrix.target == 'linux' || matrix.target == 'windows' || matrix.target == 'macos'
        shell: bash
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: Qualify target
        shell: bash
        run: |
          chmod +x tools/*.sh
          ./tools/f15_qualify_target.sh '${{ matrix.target }}'
      - name: Verify evidence
        shell: bash
        run: python3 tools/f15_validate_evidence_file.py '${{ matrix.target }}' 'docs/f15/evidence/${{ matrix.target }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: f15-evidence-${{ matrix.target }}
          path: docs/f15/evidence/${{ matrix.target }}.json
          if-no-files-found: error
  bundle:
    name: Evidence bundle
    needs: qualify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: f15-evidence-*
          path: evidence
          merge-multiple: true
      - name: Build evidence bundle
        run: zip -j F15_EVIDENCE_BUNDLE.zip evidence/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: F15_EVIDENCE_BUNDLE
          path: F15_EVIDENCE_BUNDLE.zip
