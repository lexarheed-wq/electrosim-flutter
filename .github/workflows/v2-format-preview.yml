name: V2 format preview

on:
  workflow_dispatch:
  push:
    branches:
      - v2-post-mac-audit-fixes-20261005
    paths:
      - '.github/workflows/v2-format-preview.yml'

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Print Dart formatter diff
        working-directory: apps/electrosim
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/f20_catalog_components.dart lib/reference_components/reference_widgets_extended.dart test/f20_catalog_visual_identity_test.dart
          git diff -- lib/f20_catalog_components.dart lib/reference_components/reference_widgets_extended.dart test/f20_catalog_visual_identity_test.dart
