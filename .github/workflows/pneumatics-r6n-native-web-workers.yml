name: PNEU R6N Persistent Isolate and Web Worker Contract
on:
  push:
    branches:
      - feat/pneumatics-r6n-perf-workers-20261011
  pull_request:
    branches:
      - feat/g5-industrial-geometry-20261009
permissions:
  contents: read
jobs:
  native-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.9'
      - name: Native isolate regression and compiled real browser worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/pneumatics-r6n
          echo "sha=$(git rev-parse HEAD)" | tee build/pneumatics-r6n/PROVENANCE.txt
          dart --version | tee -a build/pneumatics-r6n/PROVENANCE.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd packages/electrosim_pneumatic_solver
          dart pub get
          dart format lib/src/r6n_network_job.dart lib/src/r6n_worker.dart lib/src/r6n_worker_stub.dart lib/src/r6n_worker_native.dart lib/src/r6n_worker_web.dart tool/r6n_web_worker_main.dart test/r6n_worker_test.dart
          git diff -- lib/src/r6n_network_job.dart lib/src/r6n_worker.dart lib/src/r6n_worker_stub.dart lib/src/r6n_worker_native.dart lib/src/r6n_worker_web.dart tool/r6n_web_worker_main.dart test/r6n_worker_test.dart
          dart analyze
          dart test --concurrency=1 --reporter expanded
          dart run benchmark/r6n_worker_transport.dart > ../../build/pneumatics-r6n/native-worker-transport.json
          python3 -m json.tool ../../build/pneumatics-r6n/native-worker-transport.json > /dev/null
          cat ../../build/pneumatics-r6n/native-worker-transport.json
          dart compile js -O2 -o ../../build/pneumatics-r6n/r6n_worker.dart.js tool/r6n_web_worker_main.dart
          cp tool/r6n_browser_smoke.html ../../build/pneumatics-r6n/index.html
          test -s ../../build/pneumatics-r6n/r6n_worker.dart.js
          git diff --exit-code -- lib/src/r6n_network_job.dart lib/src/r6n_worker.dart lib/src/r6n_worker_stub.dart lib/src/r6n_worker_native.dart lib/src/r6n_worker_web.dart tool/r6n_web_worker_main.dart test/r6n_worker_test.dart
          cd ../..
          git diff --check
          git diff --exit-code -- . ':(exclude)**/pubspec.lock'
      - name: Exercise real worker in Chromium (DOM acceptance)
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME" || { echo "Chromium unavailable"; exit 1; }
          python3 -m http.server 8796 --bind 127.0.0.1 --directory build/pneumatics-r6n >build/pneumatics-r6n/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8796/ > /dev/null; then break; fi
            sleep 1
          done
          node packages/electrosim_pneumatic_solver/tool/r6n_browser_cdp.mjs "$CHROME" http://127.0.0.1:8796/ \
            | tee build/pneumatics-r6n/chromium-worker-proof.txt
          grep -Fx 'R6N_WEB_WORKER_PASS' build/pneumatics-r6n/chromium-worker-proof.txt
          "$CHROME" --version | tee build/pneumatics-r6n/CHROMIUM_VERSION.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pneumatics-r6n-worker-${{ github.sha }}
          path: build/pneumatics-r6n/
          retention-days: 21

  mac-intel-native-isolate:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.9'
      - name: Native R6N Mac Intel AOT parity and observed isolated solver transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p build/pneumatics-r6n-mac-intel
          printf 'sourceSha=%s\\narchitecture=%s\\n' "$GITHUB_SHA" "$(uname -m)" > build/pneumatics-r6n-mac-intel/PROVENANCE.txt
          sw_vers >> build/pneumatics-r6n-mac-intel/PROVENANCE.txt
          dart --version 2>&1 | tee -a build/pneumatics-r6n-mac-intel/PROVENANCE.txt
          cd packages/electrosim_pneumatic_solver
          dart pub get
          dart test --concurrency=1 --reporter expanded test/r6n_worker_test.dart test/r6n_worker_scheduler_test.dart \
            | tee ../../build/pneumatics-r6n-mac-intel/TEST.log
          dart compile exe -o ../../build/pneumatics-r6n-mac-intel/native-worker-aot benchmark/r6n_worker_transport.dart
          ../../build/pneumatics-r6n-mac-intel/native-worker-aot \
            | tee ../../build/pneumatics-r6n-mac-intel/native-worker-transport-mac-intel.json
          python3 -m json.tool ../../build/pneumatics-r6n-mac-intel/native-worker-transport-mac-intel.json >/dev/null
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pneumatics-r6n-mac-intel-observed-${{ github.sha }}
          path: |
            build/pneumatics-r6n-mac-intel/PROVENANCE.txt
            build/pneumatics-r6n-mac-intel/TEST.log
            build/pneumatics-r6n-mac-intel/native-worker-transport-mac-intel.json
          retention-days: 21

  integrated-flutter-web-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
      - name: Assemble releasable Flutter Web with same-engine Worker asset
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build_r6n_flutter_web.sh
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s apps/electrosim/build/web/r6n_worker.dart.js
          test -s apps/electrosim/build/web/main.dart.js
          grep -Fx "SOURCE_SHA=$GITHUB_SHA" build/pneumatics-r6n-web-bundle/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pneumatics-r6n-web-bundle-provenance-${{ github.sha }}
          path: build/pneumatics-r6n-web-bundle/PROVENANCE.txt
          retention-days: 21
