name: electrosim
publish_to: "none"
description: ElectroSim Flutter application shell with qualified runtime integration.
version: 0.9.99+99
environment:
  sdk: ">=3.10.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  electrosim_domain:
    path: ../../packages/electrosim_domain
  electrosim_controls:
    path: ../../packages/electrosim_controls
  electrosim_protection:
    path: ../../packages/electrosim_protection
  electrosim_canvas:
    path: ../../packages/electrosim_canvas
  electrosim_ui_kit:
    path: ../../packages/electrosim_ui_kit
  electrosim_topology:
    path: ../../packages/electrosim_topology
  electrosim_solver_dc:
    path: ../../packages/electrosim_solver_dc
  electrosim_solver_ac:
    path: ../../packages/electrosim_solver_ac
  electrosim_pv:
    path: ../../packages/electrosim_pv
  electrosim_energy:
    path: ../../packages/electrosim_energy
  electrosim_diagnostics:
    path: ../../packages/electrosim_diagnostics
  electrosim_scenarios:
    path: ../../packages/electrosim_scenarios
  electrosim_measurements:
    path: ../../packages/electrosim_measurements
  electrosim_tp:
    path: ../../packages/electrosim_tp
  electrosim_storage:
    path: ../../packages/electrosim_storage
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
