name: G5 Passive Realism Mac Intel
on:
  push:
    branches:
      - feat/g5-passive-realism-20261010
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: g5-passive-realism-mac
  cancel-in-progress: true
jobs:
  macos-intel-candidate:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Validate and build exact G5 source on macOS Intel
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          base="$(pwd)"
          python3 tools/premium_rcd2p/decode_source.py
          runner="$(bash tools/f17_prepare_release_runner.sh macos)"
          case "$runner" in
            F17_RUNNER_PATH=*) root="${runner#F17_RUNNER_PATH=}" ;;
            *) echo "INVALID_F17_RUNNER_PROTOCOL: $runner"; exit 69 ;;
          esac
          cd "$root/apps/electrosim"
          flutter pub get
          flutter analyze
          flutter test --concurrency=1
          flutter test tool/capture_g5_industrial_test.dart
          flutter create --platforms=web --project-name electrosim .
          flutter pub get
          flutter build web --release --target lib/student_web_main.dart --no-web-resources-cdn --pwa-strategy=none --no-wasm-dry-run
          flutter config --enable-macos-desktop
          flutter build macos --release
          app="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          web_dest="$app/Contents/Resources/electrosim_student_web"
          mkdir -p "$web_dest"
          cp -R build/web/. "$web_dest/"
          python3 "$base/tools/f17_validate_student_mac_bundle.py" "$app"
          codesign --force --sign - --entitlements macos/Runner/Release.entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          executable="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$executable"
          output="$base/g5-passives-macOS"
          mkdir -p "$output"
          file "$executable" | tee "$output/ARCHITECTURE.txt"
          grep -qi x86_64 "$output/ARCHITECTURE.txt"
          printf '%s\n' "$GITHUB_SHA" > "$output/SOURCE_SHA.txt"
          printf '%s\n' 'G5 passive realism — physical Mac acceptance pending user validation.' > "$output/READ_ME_FIRST.txt"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$output/ElectroSim_G5_Passives_Mac_Intel.zip"
          python3 "$base/tools/f17_validate_student_mac_bundle.py" "$output/ElectroSim_G5_Passives_Mac_Intel.zip"
          (cd "$output" && shasum -a 256 ElectroSim_G5_Passives_Mac_Intel.zip > SHA256.txt)
          (cd "$output" && unzip -t ElectroSim_G5_Passives_Mac_Intel.zip | tail -1)
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-G5-Passives-Mac-Intel
          path: g5-passives-macOS/
          retention-days: 14
          if-no-files-found: error
