name: One-shot Dart format normalization
# normalization-pass-2

on:
  push:
    branches:
      - migration-c15-full-parity
    paths:
      - ".github/workflows/one-shot-dart-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      - name: Normalize authored Dart
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            find apps/electrosim packages tools               -type f -name '*.dart'               -not -path '*/.dart_tool/*'               -print0
          )
          dart format "${files[@]}"
          git status --short

      - name: Commit normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ElectroSim CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/electrosim packages tools
          if git diff --cached --quiet; then
            echo "DART_FORMAT_ALREADY_CLEAN"
            exit 0
          fi
          git commit -m "style: normalize Dart source with locked toolchain"
          git push origin HEAD:${GITHUB_REF_NAME}
