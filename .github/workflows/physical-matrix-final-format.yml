name: Physical Matrix Source Formatter
on:
  pull_request:
    branches: [feat/g5-industrial-geometry-20261009]
permissions:
  contents: write
jobs:
  canonical-format:
    if: github.head_ref == 'audit/g5-physical-behavior-matrix-20261010'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
      - name: Format audited source and push
        shell: bash
        run: |
          set -euo pipefail
          dart format apps/electrosim/test/physical_matrix_qualification_test.dart
          git diff --check
          git add apps/electrosim/test/physical_matrix_qualification_test.dart
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(audit): canonical matrix source"
            git fetch origin "audit/g5-physical-behavior-matrix-20261010"
            git rebase FETCH_HEAD
            git push origin "HEAD:audit/g5-physical-behavior-matrix-20261010"
          fi
