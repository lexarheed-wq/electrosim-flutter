name: CANVAS-RQ nonblocking geometry gate

on:
  push:
    branches:
      - fix/canvas-geometry-routing-20261008
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Architecture
        run: |
          git diff --check
          python3 tools/core_unify_architecture_guard.py
      - name: Analyze and test asynchronous geometry routing
        working-directory: apps/electrosim
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-pub lib/main.dart lib/runtime/electrosim_connection_router.dart test/f18_drag_architecture_test.dart test/audit_canvas_routing_performance_test.dart
          flutter test --no-pub test/connection_router_worker_test.dart test/f18_drag_architecture_test.dart test/audit_canvas_routing_performance_test.dart test/audit_visual_layout_persistence_test.dart
