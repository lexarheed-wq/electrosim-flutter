name: V1 parity point 3 navigation

on:
  push:
    branches:
      - v1-parity
    paths:
      - "apps/electrosim/lib/main.dart"
      - "apps/electrosim/lib/f18_home.dart"
      - "apps/electrosim/lib/f18_shell_navigation.dart"
      - "apps/electrosim/lib/f18_session_coordinator.dart"
      - "apps/electrosim/lib/f18_v1_navigation_flow.dart"
      - "apps/electrosim/lib/f17_tp_supervision_panel.dart"
      - "apps/electrosim/lib/runtime/electrosim_tp_session_controller.dart"
      - "apps/electrosim/lib/runtime/electrosim_lan_sync.dart"
      - "apps/electrosim/lib/runtime/electrosim_student_web_bundle.dart"
      - "apps/electrosim/lib/runtime/electrosim_student_web_sync.dart"
      - "apps/electrosim/lib/navigation_proof_main.dart"
      - "apps/electrosim/lib/student_web_main.dart"
      - "apps/electrosim/pubspec.yaml"
      - "apps/electrosim/test/**"
      - "run_visual.sh"
      - "tools/run_macos_test.sh"
      - "reference/v1/tools/test_point3_macos_launcher_contract.py"
      - ".github/workflows/v1-parity-point3-navigation.yml"
  pull_request:
    branches:
      - v1-parity

permissions:
  contents: read

jobs:
  navigation-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          dart --version 2>&1 | grep "3.10.9"

      - name: Validate macOS launcher LAN permissions
        run: python3 -m unittest reference/v1/tools/test_point3_macos_launcher_contract.py

      - name: Resolve application
        working-directory: apps/electrosim
        run: flutter pub get

      - name: Analyze application
        working-directory: apps/electrosim
        run: flutter analyze

      - name: Run V1 navigation regression tests
        working-directory: apps/electrosim
        shell: bash
        run: |
          set +e
          mkdir -p ../../audit/point3
          flutter test test/f18_g2_navigation_test.dart 2>&1 | tee ../../audit/point3/f18_g2_navigation_test.log
          s1=${PIPESTATUS[0]}
          flutter test test/f18_g3_session_dashboard_test.dart 2>&1 | tee ../../audit/point3/f18_g3_session_dashboard_test.log
          s2=${PIPESTATUS[0]}
          flutter test test/f9_shell_test.dart 2>&1 | tee ../../audit/point3/f9_shell_test.log
          s3=${PIPESTATUS[0]}
          flutter test test/f17_lan_sync_test.dart 2>&1 | tee ../../audit/point3/f17_lan_sync_test.log
          s4=${PIPESTATUS[0]}
          printf 'f18_g2=%s\nf18_g3=%s\nf9_shell=%s\nf17_lan=%s\n' "$s1" "$s2" "$s3" "$s4" | tee ../../audit/point3/navigation-status.txt
          if [ "$s1" -ne 0 ] || [ "$s2" -ne 0 ] || [ "$s3" -ne 0 ] || [ "$s4" -ne 0 ]; then
            exit 1
          fi

      - name: Upload navigation diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-parity-point3-navigation-logs
          path: audit/point3
          if-no-files-found: error
          retention-days: 14

      - name: Run application non-golden regression suite
        working-directory: apps/electrosim
        shell: bash
        run: |
          set +e
          find test -name "*_test.dart" ! -name "f9_goldens_test.dart" -print0 |
            xargs -0 flutter test 2>&1 | tee ../../audit/point3/full-non-golden-regression.log
          status=${PIPESTATUS[1]}
          echo "$status" > ../../audit/point3/full-non-golden-status.txt
          exit "$status"

      - name: Upload full regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-parity-point3-full-regression-logs
          path: |
            audit/point3/full-non-golden-regression.log
            audit/point3/full-non-golden-status.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Build Chromium teacher and student Web proofs
        working-directory: apps/electrosim
        shell: bash
        run: |
          set +e
          flutter create --platforms=web --project-name electrosim . >/dev/null 2>&1
          create_status=$?
          if [ "$create_status" -ne 0 ]; then
            echo "flutter create web failed with status $create_status" |
              tee ../../audit/point3/web-build.log
            echo "$create_status" > ../../audit/point3/web-build-status.txt
            exit "$create_status"
          fi

          rm -rf ../../audit/point3/navigation-web ../../audit/point3/student-web
          flutter build web --release -t lib/navigation_proof_main.dart 2>&1 |
            tee ../../audit/point3/navigation-web-build.log
          teacher_status=${PIPESTATUS[0]}
          if [ "$teacher_status" -ne 0 ]; then
            echo "$teacher_status" > ../../audit/point3/web-build-status.txt
            exit "$teacher_status"
          fi
          cp -R build/web ../../audit/point3/navigation-web

          rm -rf build/web
          flutter build web --release -t lib/student_web_main.dart 2>&1 |
            tee ../../audit/point3/student-web-build.log
          student_status=${PIPESTATUS[0]}
          echo "$student_status" > ../../audit/point3/web-build-status.txt
          if [ "$student_status" -ne 0 ]; then
            exit "$student_status"
          fi
          cp -R build/web ../../audit/point3/student-web
          printf 'teacher=%s\nstudent=%s\n' "$teacher_status" "$student_status" |
            tee ../../audit/point3/web-build.log

      - name: Upload Chromium proof build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-parity-point3-web-build-logs
          path: |
            audit/point3/web-build.log
            audit/point3/web-build-status.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Capture real Chromium proof for all canonical states
        working-directory: apps/electrosim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../audit/point3/chromium
          python3 -m http.server 8765 --directory ../../audit/point3/navigation-web > ../../audit/point3/chromium/http-teacher.log 2>&1 &
          teacher_pid=$!
          python3 -m http.server 8766 --directory ../../audit/point3/student-web > ../../audit/point3/chromium/http-student.log 2>&1 &
          student_pid=$!
          trap 'kill "$teacher_pid" "$student_pid" 2>/dev/null || true' EXIT

          for port in 8765 8766; do
            for attempt in {1..50}; do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then
                break
              fi
              sleep 0.2
            done
            curl -fsS "http://127.0.0.1:${port}/" >/dev/null
          done

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "CHROMIUM_NOT_FOUND" >&2
            exit 70
          fi
          "$chrome" --version | tee ../../audit/point3/chromium/chromium-version.txt

          screens=(home create waiting dashboard setup supervision maintenance validation design workshop)
          for screen in "${screens[@]}"; do
            out="../../audit/point3/chromium/${screen}.png"
            timeout 45s "$chrome"               --headless=new               --no-sandbox               --disable-gpu               --disable-dev-shm-usage               --disable-background-networking               --disable-default-apps               --disable-extensions               --disable-sync               --no-first-run               --hide-scrollbars               --window-size=1440,900               --virtual-time-budget=5000               --screenshot="$out"               "http://127.0.0.1:8765/?screen=${screen}"
            test -s "$out"
          done

          student_screens=(join waiting hub closed)
          for screen in "${student_screens[@]}"; do
            out="../../audit/point3/chromium/student_${screen}.png"
            timeout 45s "$chrome"               --headless=new               --no-sandbox               --disable-gpu               --disable-dev-shm-usage               --disable-background-networking               --disable-default-apps               --disable-extensions               --disable-sync               --no-first-run               --hide-scrollbars               --window-size=390,844               --force-device-scale-factor=1               --virtual-time-budget=5000               --screenshot="$out"               "http://127.0.0.1:8766/?proof=${screen}"
            test -s "$out"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct

          root = Path('../../audit/point3/chromium')
          expected = {
              'home', 'create', 'waiting', 'dashboard', 'setup',
              'supervision', 'maintenance', 'validation', 'design', 'workshop',
              'student_join', 'student_waiting', 'student_hub', 'student_closed',
          }
          found = {p.stem for p in root.glob('*.png')}
          if found != expected:
              raise SystemExit(f'CHROMIUM_SCREEN_SET_MISMATCH expected={sorted(expected)} found={sorted(found)}')
          for path in sorted(root.glob('*.png')):
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'INVALID_PNG:{path}')
              width, height = struct.unpack('>II', data[16:24])
              expected_size = (390, 844) if path.stem.startswith('student_') else (1440, 900)
              if (width, height) != expected_size:
                  raise SystemExit(f'PNG_SIZE_MISMATCH:{path}:{width}x{height}:expected={expected_size}')
              if len(data) < 15000:
                  raise SystemExit(f'PNG_TOO_SMALL:{path}:{len(data)}')
              print(f'CHROMIUM_PROOF_PASS {path.name} {width}x{height} {len(data)} bytes')

          fingerprints = {}
          for path in sorted(root.glob('*.png')):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest in fingerprints:
                  raise SystemExit(
                      f'DUPLICATE_CHROMIUM_STATE:{fingerprints[digest]}={path.name}:{digest}'
                  )
              fingerprints[digest] = path.name
          print(f'CHROMIUM_UNIQUE_STATES_PASS {len(fingerprints)}')
          PY

      - name: Upload Chromium screenshots
        uses: actions/upload-artifact@v4
        with:
          name: v1-parity-point3-chromium-screenshots
          path: audit/point3/chromium
          if-no-files-found: error
          retention-days: 14

      - name: Upload Chromium proof build
        uses: actions/upload-artifact@v4
        with:
          name: v1-parity-point3-navigation-web
          path: |
            audit/point3/navigation-web
            audit/point3/student-web
          if-no-files-found: error
          retention-days: 14

      - name: Gate
        run: echo V1_PARITY_POINT3_NAVIGATION_PASS
