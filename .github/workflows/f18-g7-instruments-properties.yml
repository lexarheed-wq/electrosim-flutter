name: F18-G7 Instruments and properties

on:
  workflow_dispatch:
  push:
    branches:
      - f18-g7-instruments-properties-20261006
      - v2-post-mac-audit-fixes-20261005
    paths:
      - 'apps/electrosim/**'
      - 'packages/electrosim_measurements/**'
      - 'packages/electrosim_solver_dc/**'
      - 'packages/electrosim_solver_ac/**'
      - 'packages/electrosim_pv/**'
      - 'tools/f18_g7_contract.py'
      - '.github/workflows/f18-g7-instruments-properties.yml'
      - 'docs/f18/g7/**'

permissions:
  contents: read

jobs:
  g7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Verify locked toolchain
        run: |
          flutter --version | grep '3.38.10'
          dart --version 2>&1 | grep '3.10.9'

      - name: Static G7 architecture contract
        run: python3 tools/f18_g7_contract.py

      - name: Resolve application dependencies
        working-directory: apps/electrosim
        run: flutter pub get

      - name: Preview canonical Dart formatting
        run: |
          dart format \
            apps/electrosim/lib/f18_g7_property_presenter.dart \
            apps/electrosim/lib/f9_context_panels.dart \
            apps/electrosim/lib/runtime/electrosim_runtime_engine.dart \
            apps/electrosim/test/f18_g7_instruments_properties_test.dart \
            packages/electrosim_measurements/lib/src/device_state_domain_extensions.dart
          git diff -- apps/electrosim/test/f18_g7_instruments_properties_test.dart || true

      - name: Analyze application
        working-directory: apps/electrosim
        run: flutter analyze

      - name: G7 targeted application tests
        working-directory: apps/electrosim
        run: |
          flutter test test/f18_g7_instruments_properties_test.dart
          flutter test test/f17_measurement_ui_test.dart
          flutter test test/f17_runtime_engine_test.dart
          flutter test test/f17_pv_energy_runtime_test.dart
          flutter test test/f9_shell_test.dart

      - name: Measurement and DeviceStateEngine regression
        working-directory: packages/electrosim_measurements
        run: |
          dart pub get
          dart analyze
          dart test

      - name: G6 interaction non-regression
        working-directory: apps/electrosim
        run: |
          flutter test test/f18_g3r1_point06_topbar_actions_rotation_test.dart
          flutter test test/f18_g3r1_point10_integrated_visible_contract_test.dart

      - name: Gate marker
        run: echo F18_G7_INSTRUMENTS_PROPERTIES_GATE_PASS
