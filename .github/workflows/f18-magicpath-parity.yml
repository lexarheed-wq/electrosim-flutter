name: F18 MagicPath Parity

on:
  workflow_dispatch:
  push:
    branches:
      - f18-magicpath-parity
    paths:
      - 'apps/electrosim/**'
      - 'packages/electrosim_canvas/**'
      - 'packages/electrosim_ui_kit/**'
      - 'docs/f18/magicpath_parity/**'
      - '.github/workflows/f18-magicpath-parity.yml'

permissions:
  contents: read

jobs:
  parity-stage-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Verify locked toolchain
        run: |
          flutter --version
          dart --version 2>&1 | grep '3.10.9'
      - name: Resolve Canvas package
        working-directory: packages/electrosim_canvas
        run: flutter pub get
      - name: Analyze Canvas package
        working-directory: packages/electrosim_canvas
        run: flutter analyze
      - name: Canvas package non-golden regression
        working-directory: packages/electrosim_canvas
        shell: bash
        run: |
          set -euo pipefail
          find test -name '*_test.dart' ! -name 'simulator_canvas_golden_test.dart' -print0 | xargs -0 flutter test
      - name: Resolve application
        working-directory: apps/electrosim
        run: flutter pub get
      - name: Analyze application
        working-directory: apps/electrosim
        run: flutter analyze
      - name: MagicPath parity contract
        working-directory: apps/electrosim
        run: flutter test test/f18_magicpath_parity_test.dart
      - name: Preserve G3R1 recovery contracts
        working-directory: apps/electrosim
        shell: bash
        run: |
          set -euo pipefail
          for test_file in test/f18_g3r1_point*_test.dart; do
            flutter test "$test_file"
          done
      - name: Application non-golden regression
        working-directory: apps/electrosim
        shell: bash
        run: |
          set -euo pipefail
          find test -name '*_test.dart' ! -name 'f9_goldens_test.dart' -print0 | xargs -0 flutter test
      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only f52da0acba9e93032433849756abfdea17dc442d...HEAD)"
          forbidden="$(printf '%s\n' "$changed" | grep -Ev '^(apps/electrosim/|packages/electrosim_canvas/|packages/electrosim_ui_kit/|docs/f18/magicpath_parity/|\.github/workflows/f18-magicpath-parity\.yml$)' || true)"
          if [ -n "$forbidden" ]; then
            echo 'MagicPath parity modified files outside the approved UI/Canvas scope:'
            echo "$forbidden"
            exit 1
          fi
          echo F18_MAGICPATH_PARITY_SCOPE_PASS
      - name: Stage 1 gate
        run: echo F18_MAGICPATH_PARITY_STAGE1_PASS


  capture-magicpath-references:
    name: Capture qualified MagicPath previews
    needs: parity-stage-1
    runs-on: ubuntu-latest
    steps:
      - name: Download immutable reference previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p references
          curl -fL --retry 3 'https://storage.googleapis.com/storage.magicpath.ai/component-previews/dd9d576f-23b2-4959-b009-8c2d02b778c9.png' -o references/01_home_desktop.png
          curl -fL --retry 3 'https://storage.googleapis.com/storage.magicpath.ai/component-previews/fd6cc932-ca25-43e9-a7b3-f7b1ea98ca64.png' -o references/02_foundations_design_tokens.png
          curl -fL --retry 3 'https://storage.googleapis.com/storage.magicpath.ai/component-previews/9f86a146-51c7-4d1f-81b3-3407f6720aae.png' -o references/03_core_ui_library.png
          curl -fL --retry 3 'https://storage.googleapis.com/storage.magicpath.ai/component-previews/40835404-cd55-4bf0-94e0-223267a7d540.png' -o references/04_electrical_visual_language_v2.png
          curl -fL --retry 3 'https://storage.googleapis.com/storage.magicpath.ai/component-previews/7cd578a6-05a4-4d64-b732-576813e1db7e.png' -o references/05_workspace_desktop.png
          curl -fL --retry 3 'https://storage.googleapis.com/storage.magicpath.ai/component-previews/5679d921-ccf6-4aa5-910e-f0fb574dc1d6.png' -o references/06_workspace_compact.png
          curl -fL --retry 3 'https://storage.googleapis.com/storage.magicpath.ai/component-previews/760492e0-7f5f-4e24-bbc1-58cd6d362164.png' -o references/07_troubleshooting_student.png
          curl -fL --retry 3 'https://storage.googleapis.com/storage.magicpath.ai/component-previews/d0e742b7-f63b-4980-b7fc-76b873b0fd01.png' -o references/08_wire_architecture_g2a.png
          file references/*.png
          sha256sum references/*.png > references/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: F18_MAGICPATH_QUALIFIED_REFERENCES
          path: references
          if-no-files-found: error
          retention-days: 30

  build-macos-candidate:
    name: Build macOS parity candidate
    needs: parity-stage-1
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Build release application in a non-destructive macOS runner
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          TMP_APP="$RUNNER_TEMP/electrosim-f18-magicpath"
          rm -rf "$TMP_APP"
          mkdir -p "$TMP_APP/apps"
          cp -R apps/electrosim "$TMP_APP/apps/electrosim"
          cp -R packages "$TMP_APP/packages"
          cd "$TMP_APP/apps/electrosim"
          cp pubspec.yaml "$RUNNER_TEMP/electrosim-pubspec.yaml"
          flutter create --platforms=macos --project-name electrosim . >/dev/null
          cp "$RUNNER_TEMP/electrosim-pubspec.yaml" pubspec.yaml
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then
            rm -f test/widget_test.dart
          fi
          flutter pub get
          flutter build macos --release
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p "$ROOT/dist"
          ditto -c -k --keepParent "$APP" "$ROOT/dist/ElectroSim-F18-MagicPath-Parity-Stage1-Mac.zip"
          shasum -a 256 "$ROOT/dist/ElectroSim-F18-MagicPath-Parity-Stage1-Mac.zip" > "$ROOT/dist/ElectroSim-F18-MagicPath-Parity-Stage1-Mac.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: F18_MAGICPATH_PARITY_STAGE1_MAC
          path: |
            dist/ElectroSim-F18-MagicPath-Parity-Stage1-Mac.zip
            dist/ElectroSim-F18-MagicPath-Parity-Stage1-Mac.zip.sha256
          if-no-files-found: error
