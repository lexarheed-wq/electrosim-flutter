name: Convergence M0-M2 qualification

on:
  push:
    branches:
      - f18-v1-v2-convergence
    paths:
      - '.github/workflows/convergence-m0-m2-qualification.yml'

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify candidate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/convergence_m2/chunk_*.b64 > /tmp/convergence.patch.gz.b64
          echo "246c5443256d24de1ba0e5a145d1d0c03f04ac01e89ecb280b7cce39e663f894  /tmp/convergence.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/convergence.patch.gz.b64 | gzip -d > /tmp/convergence.patch
          echo "ab05e40f6581a010cfcf234f863e9788b5d2db20524cddcec71ad982192cfdd4  /tmp/convergence.patch" | sha256sum -c -
          git apply --check /tmp/convergence.patch
          git apply /tmp/convergence.patch

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Verify exact Dart toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version 2>&1 | grep '3.10.9'

      - name: Static convergence contracts
        run: |
          python3 -m unittest \
            tools/test_convergence_m0_contract.py \
            tools/test_convergence_m1_domain_contract.py \
            tools/test_convergence_m1b_m2_contract.py \
            tools/test_f18_g0_tooling.py

      - name: Domain analyze and tests
        working-directory: packages/electrosim_domain
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Topology analyze and tests
        working-directory: packages/electrosim_topology
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Scenario non-migration guards
        run: |
          python3 tools/f11_static_contract_check.py
          python3 tools/f11_security_static_check.py

      - name: Qualification gate
        run: echo M2_TOPOLOGY_BRANCH_CONVERGENCE_PASS

      - name: Persist qualified M0-M2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "electrosim-ci"
          git config user.email "electrosim-ci@users.noreply.github.com"
          git add \
            .github/workflows/convergence-m0-contract.yml \
            CONVERGENCE_VERSION \
            docs/convergence \
            docs/f0/MIGRATION_MATRIX.csv \
            docs/f0/MIGRATION_MATRIX.md \
            packages/electrosim_domain \
            packages/electrosim_scenarios \
            packages/electrosim_topology \
            tools/test_convergence_m0_contract.py \
            tools/test_convergence_m1_domain_contract.py \
            tools/test_convergence_m1b_m2_contract.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "M2: qualify domain contracts and component branch topology"
          git push origin HEAD:f18-v1-v2-convergence
