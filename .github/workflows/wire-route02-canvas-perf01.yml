name: WIRE-ROUTE02 CANVAS-PERF01 qualification

on:
  push:
    branches:
      - wire-route02-canvas-perf01-20261007
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tools/**'
      - '.github/workflows/wire-route02-canvas-perf01.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wire-route02-canvas-perf01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Repository hygiene
        run: |
          set -euo pipefail
          git diff --check
          flutter --version | grep '3.38.10'
          dart --version 2>&1 | grep '3.10.9'
      - name: Canvas package
        working-directory: packages/electrosim_canvas
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test
      - name: Scenario package
        working-directory: packages/electrosim_scenarios
        run: |
          set -euo pipefail
          dart pub get
          dart analyze
          dart test
      - name: Application
        working-directory: apps/electrosim
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Upload Flutter test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wire-route02-test-failures
          path: apps/electrosim/test/failures
          if-no-files-found: ignore
          retention-days: 7

      - name: Automated gate marker
        run: echo WIRE_ROUTE02_CANVAS_PERF01_PASS
