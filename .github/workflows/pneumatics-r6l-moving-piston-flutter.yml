name: PNEU R6L Flutter Real Moving Piston
on:
  push:
    branches:
      - feat/pneumatics-r6l-physical-piston-widget-20261011
      - feat/pneumatics-r6l-resolved-g5-r6j-20261011
  pull_request:
    branches:
      - feat/pneumatics-r6j-authored-dc-network-cycle-20261011
      - feat/g5-industrial-geometry-20261009
permissions:
  contents: read
jobs:
  moving-piston-workshop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.10'
      - name: Scientific editor state invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/pneumatics-r6l
          echo "sha=$(git rev-parse HEAD)" | tee build/pneumatics-r6l/PROVENANCE.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          (
            cd packages/electrosim_multiphysics
            dart pub get
            dart format lib/src/pneumatic_workshop_state.dart
            git diff -- lib/src/pneumatic_workshop_state.dart | tee ../../build/pneumatics-r6l/FORMAT_DOMAIN.diff
            git diff --exit-code -- lib/src/pneumatic_workshop_state.dart
            dart analyze
            dart test --reporter expanded
          ) 2>&1 | tee build/pneumatics-r6l/DOMAIN.log
      - name: Flutter accepted physical rod from real gas
        shell: bash
        run: |
          set -euo pipefail
          (
            cd apps/electrosim
            flutter pub get
            dart format lib/pneumatics/pneumatic_workshop_page.dart lib/pneumatics/pneumatic_device_glyph.dart test/r6_moving_piston_workshop_test.dart
            git diff -- lib/pneumatics/pneumatic_workshop_page.dart lib/pneumatics/pneumatic_device_glyph.dart test/r6_moving_piston_workshop_test.dart | tee ../../build/pneumatics-r6l/FORMAT_UI.diff
            git diff --exit-code -- lib/pneumatics/pneumatic_workshop_page.dart lib/pneumatics/pneumatic_device_glyph.dart test/r6_moving_piston_workshop_test.dart
            flutter analyze --no-pub lib/pneumatics/pneumatic_workshop_page.dart lib/pneumatics/pneumatic_device_glyph.dart test/r6_moving_piston_workshop_test.dart
            flutter test --no-pub --reporter expanded test/r6_moving_piston_workshop_test.dart test/r6_static_valve52_calibration_test.dart test/r6_workshop_authored_runtime_test.dart test/pneumatic_workshop_test.dart
          ) 2>&1 | tee build/pneumatics-r6l/FLUTTER.log
          grep -F 'All tests passed!' build/pneumatics-r6l/FLUTTER.log
          git diff --check
          git diff --exit-code -- . ':(exclude)**/pubspec.lock'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pneumatics-r6l-moving-piston-${{ github.sha }}
          path: build/pneumatics-r6l/
          retention-days: 21
