name: F17-R11 LAN teacher/student sync

on:
  workflow_dispatch:
  push:
    branches:
      - f17-r11-lan-sync
    paths:
      - 'apps/electrosim/**'
      - '.github/workflows/f17-r11-lan-sync.yml'

permissions:
  contents: read

jobs:
  lan-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Resolve app dependencies
        working-directory: apps/electrosim
        run: flutter pub get

      - name: Analyze R11 synchronization
        working-directory: apps/electrosim
        run: dart analyze lib test/f17_lan_sync_test.dart test/f17_tp_session_controller_test.dart test/f17_tp_session_ui_test.dart test/f17_persistence_test.dart test/f17_pv_energy_runtime_test.dart test/f17_runtime_engine_test.dart

      - name: Run R11 and F17 regressions
        working-directory: apps/electrosim
        run: flutter test test/f17_lan_sync_test.dart test/f17_tp_session_controller_test.dart test/f17_tp_session_ui_test.dart test/f17_persistence_test.dart test/f17_pv_energy_runtime_test.dart test/f17_runtime_engine_test.dart test/f17_diagnostic_supervision_test.dart test/f17_eie_ui_test.dart test/f17_measurement_ui_test.dart test/f9_shell_test.dart

      - name: Gate marker
        run: echo F17_R11_LAN_SYNC_GATE_PASS
