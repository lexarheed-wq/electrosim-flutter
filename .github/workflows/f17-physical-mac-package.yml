name: F17 physical Mac validation package

on:
  push:
    branches:
      - f17-physical-mac-validation
    paths:
      - '.github/workflows/f17-physical-mac-package.yml'
      - 'tools/run_macos_test.sh'
      - 'docs/f17/PHYSICAL_MAC_VALIDATION.md'

permissions:
  contents: read

jobs:
  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify qualified marker
        run: test "$(cat VERSION)" = "ELECTROSIM2-F17-R12-QUALIFIED"
      - name: Validate launcher syntax
        run: bash -n tools/run_macos_test.sh
      - name: Create Mac validation source ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -qr dist/ElectroSim2-F17-R12-QUALIFIED-Mac-Validation.zip .             -x '.git/*' 'dist/*' '.dart_tool/*' 'build/*' '**/.DS_Store'
          sha256sum dist/ElectroSim2-F17-R12-QUALIFIED-Mac-Validation.zip             > dist/ElectroSim2-F17-R12-QUALIFIED-Mac-Validation.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim2-F17-R12-QUALIFIED-Mac-Validation
          path: |
            dist/ElectroSim2-F17-R12-QUALIFIED-Mac-Validation.zip
            dist/ElectroSim2-F17-R12-QUALIFIED-Mac-Validation.zip.sha256
          if-no-files-found: error

  mac-intel-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify locked official Mac Intel Flutter archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="flutter_macos_3.38.10-stable.zip"
          EXPECTED="b7056ba00082b9b814415e7516287bb94633c1108838bfe10f8f665307b99afa"
          URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$ARCHIVE"

          mkdir -p dist/bundle/toolchain/archives
          curl --fail --location --retry 3 "$URL" -o "dist/bundle/toolchain/archives/$ARCHIVE"

          ACTUAL="$(sha256sum "dist/bundle/toolchain/archives/$ARCHIVE" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          printf '%s  %s\n' "$ACTUAL" "$ARCHIVE" > dist/bundle/toolchain/SHA256SUMS.txt

          cp ci/TOOLCHAIN_LOCK.json dist/bundle/toolchain/TOOLCHAIN_LOCK.json
          (
            cd dist/bundle
            zip -qr ../ElectroSim-Flutter-3.38.10-Dart-3.10.9-macOS-Intel-offline.zip toolchain
          )
          sha256sum dist/ElectroSim-Flutter-3.38.10-Dart-3.10.9-macOS-Intel-offline.zip             > dist/ElectroSim-Flutter-3.38.10-Dart-3.10.9-macOS-Intel-offline.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroSim-Flutter-3.38.10-macOS-Intel-offline
          path: |
            dist/ElectroSim-Flutter-3.38.10-Dart-3.10.9-macOS-Intel-offline.zip
            dist/ElectroSim-Flutter-3.38.10-Dart-3.10.9-macOS-Intel-offline.zip.sha256
          if-no-files-found: error
