name: One-shot Dart format normalization
# normalization-pass-2

on:
  push:
    branches:
      - migration-c15-full-parity
      - feat/postv2-p3-export-pdf-ui-r3-20261010
    paths:
      - ".github/workflows/one-shot-dart-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      - name: Normalize authored Dart
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "feat/postv2-p3-export-pdf-ui-r3-20261010" ]; then
            dart format apps/electrosim/lib/industrial_schematic_references.dart apps/electrosim/test/postv2_p3_reference_projection_test.dart
          else
            mapfile -d '' files < <(
              find apps/electrosim packages tools -type f -name '*.dart' -not -path '*/.dart_tool/*' -print0
            )
            dart format "${files[@]}"
          fi
          git status --short

      - name: Commit normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ElectroSim CI"
          git config user.email "actions@users.noreply.github.com"
          if [ "$GITHUB_REF_NAME" = "feat/postv2-p3-export-pdf-ui-r3-20261010" ]; then
            git add apps/electrosim/lib/industrial_schematic_references.dart apps/electrosim/test/postv2_p3_reference_projection_test.dart
          else
            git add apps/electrosim packages tools
          fi
          if git diff --cached --quiet; then
            echo "DART_FORMAT_ALREADY_CLEAN"
            exit 0
          fi
          git commit -m "style: normalize Dart source with locked toolchain"
          git push origin HEAD:${GITHUB_REF_NAME}
