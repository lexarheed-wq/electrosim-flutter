name: F18-G3 Session Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - f18-g3-session-dashboard
    paths:
      - 'apps/electrosim/**'
      - 'docs/f18/g3/**'
      - 'docs/superpowers/specs/2026-10-01-electrosim-f18-g3-session-dashboard-design.md'
      - 'docs/superpowers/plans/2026-10-01-electrosim-f18-g3-session-dashboard.md'
      - '.github/workflows/f18-g3-session-dashboard.yml'

permissions:
  contents: read

jobs:
  session-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Verify toolchain
        run: |
          flutter --version
          dart --version 2>&1 | grep '3.10.9'
      - name: Resolve application
        working-directory: apps/electrosim
        run: flutter pub get
      - name: Analyze application
        working-directory: apps/electrosim
        run: flutter analyze
      - name: Run G3 session tests
        working-directory: apps/electrosim
        run: flutter test test/f18_g3_session_dashboard_test.dart
