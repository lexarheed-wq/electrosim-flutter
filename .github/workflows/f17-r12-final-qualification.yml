name: F17-R12 final cross-platform qualification

on:
  workflow_dispatch:
  push:
    branches:
      - f17-r12-final-qualification
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tools/f15_*'
      - 'tools/f17_*'
      - '.github/workflows/f17-r12-final-qualification.yml'

permissions:
  contents: read

jobs:
  integration:
    name: Full integration regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Validate LAN platform tooling
        run: python3 tools/test_f17_lan_platform_config.py

      - name: Resolve application dependencies
        working-directory: apps/electrosim
        run: flutter pub get

      - name: Analyze complete application
        working-directory: apps/electrosim
        run: flutter analyze

      - name: Run complete application test suite
        working-directory: apps/electrosim
        run: flutter test

      - name: Integration marker
        run: echo F17_R12_INTEGRATION_REGRESSION_PASS

  qualify:
    name: Qualify ${{ matrix.target }}
    needs: integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: android
            os: ubuntu-latest
          - target: macos
            os: macos-14
          - target: ios
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Linux desktop prerequisites
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Enable desktop target
        if: matrix.target == 'linux' || matrix.target == 'windows' || matrix.target == 'macos'
        shell: bash
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Qualify generated runner
        shell: bash
        run: |
          chmod +x tools/*.sh
          ./tools/f15_qualify_target.sh '${{ matrix.target }}'

      - name: Verify evidence
        shell: bash
        run: python3 tools/f15_validate_evidence_file.py '${{ matrix.target }}' 'docs/f15/evidence/${{ matrix.target }}.json'

      - uses: actions/upload-artifact@v4
        with:
          name: f17-r12-evidence-${{ matrix.target }}
          path: docs/f15/evidence/${{ matrix.target }}.json
          if-no-files-found: error

  final-gate:
    name: Final qualification gate
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: f17-r12-evidence-*
          path: evidence
          merge-multiple: true

      - name: Verify complete evidence set
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected = {'linux.json','windows.json','android.json','macos.json','ios.json'}
          actual = {p.name for p in Path('evidence').glob('*.json')}
          missing = expected - actual
          if missing:
              raise SystemExit('F17_R12_EVIDENCE_MISSING ' + ','.join(sorted(missing)))
          print('F17_R12_EVIDENCE_SET_PASS')
          PY

      - name: Gate marker
        run: echo F17_R12_FINAL_QUALIFICATION_GATE_PASS
