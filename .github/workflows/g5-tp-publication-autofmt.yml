name: Format G5 TP Publication Patch
on:
  push:
    branches:
      - fix/g5-teacher-tp-publication-navigation-20261009
  pull_request:
    branches:
      - feat/g5-industrial-geometry-20261009
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: format-g5-teacher-tp-publication
  cancel-in-progress: false
jobs:
  format-authored-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
      - name: Canonical Dart formatter on authored TP patch
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            apps/electrosim/lib/f17_tp_session_dialog.dart \
            apps/electrosim/lib/f18_session_coordinator.dart \
            apps/electrosim/lib/f18_v1_navigation_flow.dart \
            apps/electrosim/lib/main.dart \
            apps/electrosim/lib/runtime/electrosim_tp_session_controller.dart \
            apps/electrosim/lib/student_web_main.dart \
            apps/electrosim/test/g5_teacher_tp_publication_navigation_test.dart
          git diff --check
          git add \
            apps/electrosim/lib/f17_tp_session_dialog.dart \
            apps/electrosim/lib/f18_session_coordinator.dart \
            apps/electrosim/lib/f18_v1_navigation_flow.dart \
            apps/electrosim/lib/main.dart \
            apps/electrosim/lib/runtime/electrosim_tp_session_controller.dart \
            apps/electrosim/lib/student_web_main.dart \
            apps/electrosim/test/g5_teacher_tp_publication_navigation_test.dart
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(g5-tp): apply Dart 3.10 canonical formatting"
            git push origin "HEAD:fix/g5-teacher-tp-publication-navigation-20261009"
          fi
