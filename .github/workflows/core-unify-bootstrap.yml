name: CORE-UNIFY bootstrap

on:
  push:
    branches:
      - core-unify-20261006
    paths:
      - 'tools/core_unify.patch.gz.b64'
      - '.github/workflows/core-unify-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: core-unify-20261006
      - name: Apply reviewed CORE-UNIFY patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/core_unify.patch.gz.b64 | gzip -d > /tmp/core_unify.patch
          git apply --check /tmp/core_unify.patch
          git apply /tmp/core_unify.patch
          python3 tools/core_unify_architecture_guard.py
          git diff --check
          rm tools/core_unify.patch.gz.b64
          rm .github/workflows/core-unify-bootstrap.yml
          git config user.name "ElectroSim CORE-UNIFY"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "CORE-UNIFY R0-R5: canonical physics runtime"
          git push origin HEAD:core-unify-20261006
