name: F17-R12 final native release qualification

on:
  workflow_dispatch:
  push:
    branches:
      - f17-r12-release-qualification
    paths:
      - 'apps/electrosim/**'
      - 'packages/**'
      - 'tools/f17_*'
      - 'tools/f15_prepare_runner.sh'
      - 'tools/f15_platform_preflight.sh'
      - 'tools/f15_flutter_env.sh'
      - 'ci/TOOLCHAIN_LOCK.json'
      - '.github/workflows/f17-r12-release-qualification.yml'

permissions:
  contents: read

jobs:
  core-regression:
    name: Core and application regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Resolve application dependencies
        working-directory: apps/electrosim
        run: flutter pub get

      - name: Verify dependency lock is stable
        shell: bash
        run: git diff --exit-code -- apps/electrosim/pubspec.lock

      - name: Analyze application
        working-directory: apps/electrosim
        run: flutter analyze

      - name: Run complete application test suite
        working-directory: apps/electrosim
        run: flutter test

      - name: Validate critical F17 packages
        shell: bash
        run: |
          set -euo pipefail
          for pkg in \
            electrosim_storage \
            electrosim_tp \
            electrosim_solver_ac \
            electrosim_pv \
            electrosim_energy \
            electrosim_diagnostics
          do
            echo "== $pkg =="
            (
              cd "packages/$pkg"
              dart pub get
              dart analyze
              dart test
            )
          done
          echo F17_R12_CORE_REGRESSION_PASS

  native-release:
    name: Native release — ${{ matrix.target }}
    needs: core-regression
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: android
            os: ubuntu-latest
          - target: macos
            os: macos-14
          - target: ios
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Linux desktop prerequisites
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Enable desktop target
        if: matrix.target == 'linux' || matrix.target == 'windows' || matrix.target == 'macos'
        shell: bash
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Qualify release target
        shell: bash
        run: bash tools/f17_qualify_release_target.sh '${{ matrix.target }}'

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: f17-r12-evidence-${{ matrix.target }}
          path: docs/f17/evidence/r12/${{ matrix.target }}.json
          if-no-files-found: error

  gate:
    name: F17-R12 gate
    needs:
      - core-regression
      - native-release
    runs-on: ubuntu-latest
    steps:
      - run: echo F17_R12_FINAL_NATIVE_RELEASE_GATE_PASS
