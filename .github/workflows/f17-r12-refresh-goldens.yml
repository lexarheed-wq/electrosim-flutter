name: F17-R12 refresh approved F9 goldens

on:
  push:
    branches:
      - f17-r12-release-qualification
    paths:
      - '.github/workflows/f17-r12-refresh-goldens.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/electrosim
        run: flutter pub get
      - name: Refresh reviewed F9 visual references
        working-directory: apps/electrosim
        run: flutter test --update-goldens test/f9_goldens_test.dart
      - name: Commit reviewed visual baselines
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/electrosim/test/goldens/*.png
          git diff --cached --quiet && { echo "No golden changes."; exit 0; }
          git commit -m "F17-R12: refresh validated F9 visual baselines"
          git push origin HEAD:f17-r12-release-qualification
