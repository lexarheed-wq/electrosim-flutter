name: Convergence M0-M2 qualification

on:
  push:
    branches:
      - f18-v1-v2-convergence
    paths:
      - '.github/workflows/convergence-m0-m2-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidate patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '...' | base64 -d | gzip -d > /tmp/convergence.patch
          echo "ab05e40f6581a010cfcf234f863e9788b5d2db20524cddcec71ad982192cfdd4  /tmp/convergence.patch" | sha256sum -c -
          git apply --check /tmp/convergence.patch
          git apply /tmp/convergence.patch
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Verify exact Dart toolchain
        run: |
          flutter --version
          dart --version 2>&1 | grep '3.10.9'
      - name: Static convergence contracts
        run: python3 -m unittest tools/test_convergence_m0_contract.py tools/test_convergence_m1_domain_contract.py tools/test_convergence_m1b_m2_contract.py tools/test_f18_g0_tooling.py
      - name: Domain analyze and tests
        working-directory: packages/electrosim_domain
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Topology analyze and tests
        working-directory: packages/electrosim_topology
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Scenario non-migration guards
        run: |
          python3 tools/f11_static_contract_check.py
          python3 tools/f11_security_static_check.py
      - name: Qualification gate
        run: echo M2_TOPOLOGY_BRANCH_CONVERGENCE_PASS
