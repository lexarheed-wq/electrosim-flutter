name: F18-G2A Wire Routing

on:
  workflow_dispatch:
  push:
    branches:
      - f18-g2a-wire-routing
    paths:
      - 'packages/electrosim_canvas/**'
      - 'docs/f18/g2a/**'
      - 'tools/f18_g2a_*'
      - '.github/workflows/f18-g2a-wire-routing.yml'

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Verify toolchain
        run: |
          flutter --version
          dart --version 2>&1 | grep '3.10.9'
      - name: Resolve canvas package
        working-directory: packages/electrosim_canvas
        run: flutter pub get
      - name: Analyze canvas package
        working-directory: packages/electrosim_canvas
        run: flutter analyze
      - name: Run G2A geometry tests
        working-directory: packages/electrosim_canvas
        run: flutter test test/wire_geometry_test.dart test/inline_component_placement_test.dart test/orthogonal_wire_router_test.dart test/conductor_bundle_planner_test.dart test/dc_rectangular_arrange_test.dart test/circuit_wire_layout_engine_test.dart test/wire_preview_planner_test.dart test/wire_semantics_test.dart test/wire_routing_robustness_test.dart

      - name: Run Canvas non-golden regression tests
        working-directory: packages/electrosim_canvas
        run: |
          flutter test \
            test/hit_test_engine_test.dart \
            test/simulator_canvas_test.dart \
            test/viewport_controller_test.dart \
            test/canvas_performance_test.dart

      - name: Run application non-golden regression tests
        working-directory: apps/electrosim
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          find test -name '*_test.dart' ! -name 'f9_goldens_test.dart' -print0 | xargs -0 flutter test

      - name: Preserve historical visual baselines
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 41911a87c6d8915b89134bc050b9844c906f652d...HEAD -- apps/electrosim/test/goldens apps/electrosim/test/f9_goldens_test.dart packages/electrosim_canvas/test/goldens)"
          if [ -n "$changed" ]; then
            echo "Historical golden evidence was modified:"
            echo "$changed"
            exit 1
          fi
          echo F18_G2A_LEGACY_GOLDENS_PRESERVED

      - name: Protect electrical engine scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 8cafdbe93b2c4756e9ec176f598c66f75763639c...HEAD)"
          forbidden="$(printf '%s\n' "$changed" | grep -E '^packages/(electrosim_domain|electrosim_topology|electrosim_solver_dc|electrosim_solver_ac|electrosim_pv|electrosim_energy|electrosim_measurements|electrosim_diagnostics|electrosim_tp|electrosim_storage)/' || true)"
          if [ -n "$forbidden" ]; then
            echo "G2A modified protected electrical scope:"
            echo "$forbidden"
            exit 1
          fi

      - name: Gate
        run: echo F18_G2A_WIRE_ROUTING_GATE_PASS
