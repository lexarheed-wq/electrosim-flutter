name: ElectroSim 2 RC1 qualification

on:
  workflow_dispatch:
  push:
    branches:
      - electrosim2-rc1
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tools/rc1_*'
      - 'tools/f15_*'
      - 'tools/f16_*'
      - 'VERSION'
      - '.github/workflows/electrosim2-rc1-qualification.yml'

permissions:
  contents: read

jobs:
  transversal:
    name: Transversal regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Run complete analyze/test sweep
        shell: bash
        run: |
          chmod +x tools/rc1_quality_gate.sh
          ./tools/rc1_quality_gate.sh

  catalog:
    name: F16 catalog gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Run F16 catalog qualification
        shell: bash
        run: |
          chmod +x tools/f16_gate.sh
          ./tools/f16_gate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RC1_F16_AUDIT_CATALOG
          path: docs/f16/audit_catalog.json
          if-no-files-found: error

  platform:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: android
            os: ubuntu-latest
          - target: macos
            os: macos-14
          - target: ios
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Linux desktop prerequisites
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Enable desktop target
        if: matrix.target == 'linux' || matrix.target == 'windows' || matrix.target == 'macos'
        shell: bash
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: Qualify target
        shell: bash
        run: |
          chmod +x tools/*.sh
          ./tools/f15_qualify_target.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: rc1-evidence-${{ matrix.target }}
          path: docs/f15/evidence/${{ matrix.target }}.json
          if-no-files-found: error

  release-audit:
    name: Release audit
    needs: [transversal, catalog, platform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Generate RC1 audit
        run: dart tools/rc1_audit.dart docs/rc1/audit_release_candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: ELECTROSIM2_RC1_AUDIT
          path: docs/rc1/audit_release_candidate.json
          if-no-files-found: error
      - name: Gate marker
        run: echo ELECTROSIM2_RC1_GATE_PASS
