name: WIRE-ROUTE02 refresh accepted F9 goldens

on:
  push:
    branches:
      - wire-route02-canvas-perf01-20261007
    paths:
      - '.github/workflows/wire-route02-refresh-goldens.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wire-route02-canvas-perf01-20261007
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Refresh only F9 golden baselines
        working-directory: apps/electrosim
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/f9_goldens_test.dart --update-goldens

      - name: Verify golden-only mutation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              apps/electrosim/test/goldens/*.png) ;;
              *) echo "Unexpected mutation: $path" >&2; exit 64 ;;
            esac
          done

      - name: Commit refreshed goldens
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/electrosim/test/goldens
          git commit -m "Tests: refresh F9 goldens for WIRE-ROUTE02"
          git push origin HEAD:wire-route02-canvas-perf01-20261007
